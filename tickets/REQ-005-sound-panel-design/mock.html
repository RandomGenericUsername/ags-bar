<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sound — anchored popover prototype</title>
<style>
/* ============================================================
   SOUND — the AGS bar's audio popover, redesigned onto the same
   visual contract as the wallpaper selector (106) and clipboard
   (107) overlays:

     · one glass chrome layer: surface + 1px hairline + soft shadow
     · no accent frame; accent is for state and action only
     · ink / dim / faint type, sentence case, no uppercase labels
     · 8px rhythm, 18px panel radius, 10.5/11.5/13/15/28 type
     · 40–44px primary targets; every pointer action has a key
     · content is the surface; the desktop stays visible behind it

   ANCHORED, NOT FULL-SCREEN. A 352px popover hangs under the
   bar's volume indicator with an 8px gap. Clicking the wallpaper
   or pressing Esc closes it; the bar icon toggles it back.

   SKIN / APPEARANCE MAPPING (for the parallel skin work):
   the chrome colour roles and the radii are custom properties on
   :root. The appearance layer can remap:
     ink / ink-dim / ink-faint   -> palette on-surface ramp
     glass / glass-strong        -> palette surface at two opacities
     hairline                    -> palette outline at low alpha
     accent / on-accent          -> palette primary / on-primary
     live                        -> semantic green (not palette)
     r-panel                     -> surface.panel.radius
     r-card                      -> surface.card.radius
     r-control                   -> surface.control.radius
     r-pill                      -> surface.pill.radius
   panel-w is an app literal (352px), not a skin layout token. It
   would need a layout.ags.audio-panel-width token before it can be
   remapped. Some translucent hover/fill overlays and all content
   art (wallpaper, album covers, app tiles) remain literals.
   ============================================================ */

:root {
  /* ink */
  --ink: #f6f5f8;
  --ink-dim: rgba(246, 245, 248, .62);
  --ink-faint: rgba(246, 245, 248, .40);

  /* chrome */
  --hairline: rgba(255, 255, 255, .13);
  --hairline-soft: rgba(255, 255, 255, .07);
  --glass: rgba(9, 9, 13, .70);
  --glass-strong: rgba(12, 12, 17, .94);
  --control-bg: rgba(255, 255, 255, .055);
  --control-hover: rgba(255, 255, 255, .10);
  --inset-bg: rgba(255, 255, 255, .045);

  /* state + action */
  --accent: #ff8a6a;
  --on-accent: #1a0b06;
  --live: #4ade80;

  /* geometry — panel-w is an app literal; the radii are skin roles */
  --panel-w: 352px;
  --bar-h: 40px;
  --gap: 8px;
  --r-panel: 18px;   /* surface.panel.radius */
  --r-card: 12px;    /* surface.card.radius */
  --r-control: 9px;  /* surface.control.radius */
  --r-pill: 999px;   /* surface.pill.radius */

  /* shared aliases used by the panel/menu chrome */
  --surface: var(--glass);
  --surface-strong: var(--glass-strong);
  --outline: var(--hairline);
  --focus-ring: var(--accent);
  --track: rgba(255, 255, 255, .16);
  --track-strong: rgba(255, 255, 255, .58);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #050407;
  color: var(--ink);
  font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
               "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; color: inherit; }
button {
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { cursor: default; }

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

kbd {
  font: inherit;
  font-size: 9.5px;
  font-weight: 650;
  line-height: 1;
  color: var(--ink-dim);
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 5px;
  padding: 3px 5px;
}

/* ── the desktop ─────────────────────────────────────────────── */

/* Dragon CSS art, reused verbatim from the wallpaper selector mock
   (106, spikes/wallpaper-selector-overlay/index.html). It is the
   live wallpaper behind the bar, not a scrim. */
#wall {
  position: fixed;
  inset: -2%;
  z-index: 0;
  background-image:
    radial-gradient(90% 80% at 22% 12%, #5b2f8a 0%, transparent 58%),
    radial-gradient(70% 70% at 78% 28%, #c23a72 0%, transparent 55%),
    radial-gradient(60% 50% at 52% 92%, #ff7a59 0%, transparent 60%),
    linear-gradient(155deg, #0d0716 0%, #241033 45%, #090510 100%);
  background-size: cover;
  background-position: center;
  transform: scale(1.02);
}

/* Edges only. The wallpaper stays the wallpaper. */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(125% 100% at 58% 40%, transparent 52%, rgba(0, 0, 0, .40) 100%),
    linear-gradient(to bottom, rgba(0, 0, 0, .18), transparent 22%);
}

/* ── faux AGS bar ────────────────────────────────────────────── */

.desktopbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  height: var(--bar-h);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
  background: rgba(8, 8, 12, .52);
  border-bottom: 1px solid rgba(255, 255, 255, .08);
  backdrop-filter: blur(22px) saturate(1.2);
  font-size: 11px;
  color: rgba(255, 255, 255, .62);
}

.db-left { display: flex; align-items: center; gap: 3px; }
.db-ws {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.db-ws.active { background: rgba(255, 255, 255, .14); color: var(--ink); }

.db-center {
  font-size: 11.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, .84);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.db-right {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 4px;
}

.db-btn {
  width: 30px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: rgba(255, 255, 255, .72);
  transition: background .16s, color .16s;
}
.db-btn:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }
.db-btn.is-active { background: rgba(255, 255, 255, .13); color: var(--ink); }

.db-mic { position: relative; }
.db-mic .live-dot {
  position: absolute;
  top: 4px;
  right: 4px;
}

/* ── the popover ─────────────────────────────────────────────── */

.audio-pop {
  position: fixed;
  top: calc(var(--bar-h) + var(--gap));
  right: 12px;
  z-index: 30;
  width: min(var(--panel-w), calc(100vw - 24px));
  max-height: calc(100vh - var(--bar-h) - var(--gap) - 12px);
  display: flex;
  flex-direction: column;
  border-radius: var(--r-panel);
  background: var(--surface);
  border: 1px solid var(--outline);
  backdrop-filter: blur(30px) saturate(1.3);
  box-shadow:
    0 24px 64px rgba(0, 0, 0, .50),
    0 3px 10px rgba(0, 0, 0, .26);
  overflow: hidden;
  transform-origin: top right;
  transition: opacity .22s ease, transform .22s ease;
}

body.is-closed .audio-pop {
  opacity: 0;
  transform: translateY(-6px) scale(.985);
  pointer-events: none;
}

.pop-scroll {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, .18) transparent;
}
.pop-scroll::-webkit-scrollbar { width: 8px; }
.pop-scroll::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, .16);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}

/* ── hero: output ────────────────────────────────────────────── */

.hero {
  padding: 12px 16px 14px;
  border-bottom: 1px solid var(--hairline-soft);
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 26px;
  margin-bottom: 6px;
}

.caption-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.caption {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-dim);
}

.muted-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--r-pill);
  background: rgba(255, 138, 106, .14);
  color: #ffd0c2;
  font-size: 10.5px;
  font-weight: 650;
}
.muted-pill::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: var(--ink-dim);
  background: transparent;
  transition: background .16s, color .16s;
}
.icon-btn:hover { background: var(--control-hover); color: var(--ink); }
.icon-btn.is-on {
  color: var(--accent);
  background: rgba(255, 138, 106, .12);
}
.icon-btn.sm {
  width: 40px;
  height: 40px;
  border-radius: 10px;
}
.icon-btn:disabled { opacity: .36; }

.device {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 10px;
  border-radius: 10px;
  background: var(--control-bg);
  color: var(--ink);
  text-align: left;
  transition: background .16s, color .16s;
}
.device:hover { background: var(--control-hover); }
.device:disabled { opacity: .48; }
.device .dev-icon { flex: 0 0 auto; color: var(--ink-dim); }
.device .dev-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 600;
}
.device .dev-note {
  flex: 0 0 auto;
  font-size: 10.5px;
  color: var(--ink-faint);
}
.device .chev { flex: 0 0 auto; color: var(--ink-faint); }

.level-row {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 14px;
  margin-top: 10px;
  min-height: 40px;
}

.big-value {
  display: flex;
  align-items: baseline;
  min-width: 68px;
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -.02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: opacity .16s;
}
.big-value .unit {
  margin-left: 1px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-dim);
}
.is-output-muted .big-value { opacity: .42; }

.hero-note {
  margin-top: 8px;
  font-size: 10.5px;
  color: var(--ink-faint);
}

/* ── ranges ──────────────────────────────────────────────────── */

.range {
  --fill: 50%;
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.range::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: var(--r-pill);
  background: linear-gradient(to right,
    var(--range-fill, var(--accent)) var(--fill),
    var(--track) var(--fill));
}
.range::-moz-range-track {
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--track);
}
.range::-moz-range-progress {
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--range-fill, var(--accent));
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  margin-top: -5px;
  border-radius: 50%;
  background: #fbfafc;
  border: 0;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .42);
  transition: transform .12s;
}
.range::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fbfafc;
  border: 0;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .42);
}
.range:hover::-webkit-slider-thumb { transform: scale(1.08); }
.range:disabled { opacity: .36; cursor: default; }

.range.secondary { --range-fill: var(--track-strong); }
.range.is-muted { --range-fill: rgba(255, 255, 255, .26); opacity: .60; }
.range:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 3px;
  border-radius: var(--r-pill);
}

/* ── sections ────────────────────────────────────────────────── */

.section { border-bottom: 1px solid var(--hairline-soft); }

.section-head {
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  text-align: left;
  transition: background .16s;
}
.section-head:hover { background: rgba(255, 255, 255, .03); }
.section-head.static { min-height: 40px; cursor: default; }
.section-head.static:hover { background: transparent; }

.section-title {
  flex: 0 0 auto;
  font-size: 13px;
  font-weight: 650;
  color: var(--ink);
}
.section-count {
  flex: 0 0 auto;
  font-size: 11.5px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.section-summary {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 11.5px;
  color: var(--ink-faint);
}
.section-head .chev {
  flex: 0 0 auto;
  margin-left: auto;
  color: var(--ink-faint);
  transition: transform .18s ease;
}
.section-head[aria-expanded="true"] .chev { transform: rotate(180deg); }

.section-body { padding: 0 8px 6px; }
.input-body { padding: 0 16px 12px; }

.empty {
  padding: 10px 2px 8px;
  font-size: 11.5px;
  color: var(--ink-faint);
  line-height: 1.5;
}
.empty strong {
  display: block;
  margin-bottom: 2px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-dim);
}

/* ── audio: one horizontally snap-scrolling page per app ─────── */

.audio-carousel {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 6px 10px;
}
.carousel-btn {
  flex: 0 0 24px;
  width: 24px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: var(--ink-faint);
  transition: background .16s, color .16s;
}
.carousel-btn:hover { background: var(--control-hover); color: var(--ink); }
.carousel-btn[hidden] { display: none; }

.page-viewport {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  transition: height .18s ease;
}
.page-viewport::-webkit-scrollbar { display: none; }

.page-track { display: flex; align-items: flex-start; }

.app-page {
  flex: 0 0 100%;
  width: 100%;
  min-width: 0;
  scroll-snap-align: start;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.page-head {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.app-art {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 700;
  color: rgba(255, 255, 255, .94);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13);
}
.app-spotify { background: radial-gradient(circle at 30% 24%, #1ed760, #0b6b35 72%); }
.app-firefox { background: radial-gradient(circle at 30% 24%, #ffb35c, #c42b6f 76%); }
.app-tidal {
  background:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .08) 0 1px, transparent 1px 5px),
    linear-gradient(150deg, #0b1220, #1b6b7a);
}
.app-vlc { background: radial-gradient(circle at 30% 24%, #ffcf7a, #c2410c 74%); }

.page-meta { flex: 1; min-width: 0; display: grid; gap: 3px; }
.page-name-line {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.app-name {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 650;
}
.page-index {
  flex: 0 0 auto;
  margin-left: auto;
  font-size: 10.5px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.live-badge {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 19px;
  padding: 0 7px;
  border-radius: var(--r-pill);
  background: rgba(74, 222, 128, .12);
  color: #c4f8d6;
  font-size: 10.5px;
  font-weight: 650;
}
.live-badge::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--live);
}

.route {
  max-width: 120px;
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  border-radius: var(--r-control);
  background: var(--control-bg);
  color: var(--ink-dim);
  font-size: 10.5px;
  font-weight: 550;
  transition: background .16s, color .16s;
}
.route:hover { background: var(--control-hover); color: var(--ink); }
.route .rt {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.page-player { display: grid; gap: 2px; }

.player-strip {
  min-height: 60px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}

.artwork {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: var(--r-control);
  background-size: cover;
  background-position: center;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13);
  overflow: hidden;
}
/* CSS album art — no external assets. Each is a small composition,
   not a flat swatch, so the page reads as artwork at 40px. */
.art-weightless {
  background:
    radial-gradient(circle at 34% 38%, rgba(255, 255, 255, .34) 0 7%, transparent 8%),
    radial-gradient(circle at 62% 62%, rgba(255, 255, 255, .18) 0 12%, transparent 13%),
    repeating-radial-gradient(circle at 50% 50%, rgba(4, 10, 16, .0) 0 7px, rgba(4, 10, 16, .22) 8px 9px),
    conic-gradient(from 210deg at 58% 42%, #072a36, #0e6b70, #6fe3c5, #12545c, #04151c);
}
.art-lofi {
  background:
    linear-gradient(to top, rgba(12, 4, 16, .78) 0 28%, transparent 56%),
    radial-gradient(circle at 72% 24%, #ffd9a0 0 10%, transparent 11%),
    linear-gradient(160deg, #2a0f3d 0%, #8c2450 48%, #ff7a59 100%);
}
.art-sola {
  background:
    radial-gradient(80% 60% at 28% 26%, rgba(125, 211, 252, .40) 0%, transparent 58%),
    repeating-linear-gradient(18deg, rgba(255, 255, 255, .07) 0 1px, transparent 1px 7px),
    linear-gradient(150deg, #06111f 0%, #123b52 56%, #04121a 100%);
}
.art-radio {
  background:
    radial-gradient(circle at 34% 32%, rgba(255, 255, 255, .22) 0 10%, transparent 11%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 6px),
    linear-gradient(150deg, #07251f 0%, #0f766e 58%, #04131a 100%);
}
.art-empty {
  background:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 8px),
    linear-gradient(150deg, #16161c 0%, #0b0b10 100%);
}

.track { flex: 1; min-width: 0; display: grid; gap: 1px; }
.track-title {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -.01em;
}
.track-artist {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 10.5px;
  color: var(--ink-dim);
}

/* Five actions share one 60px row: the secondary icons keep a
   40px vertical target but are narrow (24px). Play is 34px. */
.transport-inline {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 1px;
}
.tbtn {
  width: 24px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: var(--ink-dim);
  transition: background .16s, color .16s;
}
.tbtn:hover { background: var(--control-hover); color: var(--ink); }
.tbtn.is-on { color: var(--accent); background: rgba(255, 138, 106, .10); }
.tbtn:disabled { opacity: .28; }
.tbtn.play {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .24);
}
.tbtn.play:hover {
  background: var(--accent);
  color: var(--on-accent);
  filter: brightness(1.06);
}

.media-seek { padding: 0 0 2px; }
.range.seek-slim {
  --range-fill: var(--accent);
  height: 18px;
}
.range.seek-slim::-webkit-slider-runnable-track { height: 2px; }
.range.seek-slim::-moz-range-track,
.range.seek-slim::-moz-range-progress { height: 2px; }
.range.seek-slim::-webkit-slider-thumb {
  width: 8px;
  height: 8px;
  margin-top: -3px;
}
.range.seek-slim::-moz-range-thumb { width: 8px; height: 8px; }
.times {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: -1px;
  padding: 0 1px;

.toast {
  position: fixed;
  left: 50%;

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

<script>
/* ── icons ───────────────────────────────────────────────────── */

};

const volumeIcon = (muted, level) => muted || level <= 0 ? ICON.mute : level <= 50 ? ICON.volumeLow : ICON.volume;

/* ── simulated session ───────────────────────────────────────── */

const BASE_DEVICES = [
  { id: "speakers", name: "Studio monitors", level: 62, muted: false, available: true },
  { id: "headphones", name: "WH-1000XM5", level: 48, muted: false, available: true },

const BASE_INPUTS = [
  { id: "at2020", name: "AT2020 USB", available: true },
  { id: "builtin", name: "Built-in microphone", available: true },
  { id: "yeti", name: "Yeti Nano", available: false }
];

const BASE_APPS = [
  {
    id: "spotify", name: "Spotify", initial: "S", artClass: "app-spotify",
    route: "follow-preferred", override: null,
    volume: 74, muted: false, mixed: false, hasPlayer: true, playing: true,
    canSeek: true, canPrev: true, canNext: true, shuffle: false, repeat: "off",
    shuffleSupported: true, repeatSupported: true, position: 84, trackIndex: 0,
    tracks: [
      { title: "Weightless", artist: "Marconi Union", album: "Ambient Transmissions", length: 482, art: "art-weightless" },
      { title: "An Ending (Ascent)", artist: "Brian Eno", album: "Apollo", length: 267, art: "art-sola" }
    ]
  },

    id: "firefox", name: "Firefox", initial: "F", artClass: "app-firefox",
    route: "explicit", override: "headphones",
    volume: 50, muted: false, mixed: true, hasPlayer: false, playing: false,
    canSeek: false, canPrev: false, canNext: false, shuffle: false, repeat: "off",
    shuffleSupported: false, repeatSupported: false, position: 0, trackIndex: 0,
    tracks: []
  },
  {
    id: "tidal", name: "Tidal", initial: "T", artClass: "app-tidal",
    route: "follow-preferred", override: null,
    volume: 36, muted: false, mixed: false, hasPlayer: true, playing: false,
    canSeek: true, canPrev: true, canNext: true, shuffle: true, repeat: "all",
    shuffleSupported: true, repeatSupported: true, position: 51, trackIndex: 0,
    tracks: [
      { title: "Sola", artist: "Kiasmos", album: "II", length: 244, art: "art-sola" },
      { title: "Looped", artist: "Kiasmos", album: "Blurred", length: 211, art: "art-weightless" }

  {

    volume: 60, muted: false, mixed: false, hasPlayer: true, playing: true,
    canSeek: false, canPrev: false, canNext: false, shuffle: false, repeat: "off",
    shuffleSupported: false, repeatSupported: false, position: 0, trackIndex: 0,
    tracks: [
      { title: "Radio Paradise — Main Mix", artist: "Radio Paradise", album: "Live stream", length: null, art: "art-radio" }
    ]
  }
];

const clone = (value) => JSON.parse(JSON.stringify(value));

const state = {
  panelOpen: true,
  devices: clone(BASE_DEVICES),
  outputId: "speakers",
  apps: clone(BASE_APPS),
  focusId: "spotify",
  inputs: clone(BASE_INPUTS),
  input: {
    available: true,
    deviceId: "at2020",
    level: 44,
    muted: false,
    consumers: [{ appId: "firefox", name: "Firefox", initial: "F", artClass: "app-firefox" }]
  },
  inputOpen: false
};

/* ── helpers ─────────────────────────────────────────────────── */

const $ = (id) => document.getElementById(id);

const currentDevice = () => state.devices.find((d) => d.id === state.outputId) ?? state.devices[0];
const currentInput = () => state.inputs.find((d) => d.id === state.input.deviceId) ?? null;
const trackOf = (app) => app.tracks[app.trackIndex] ?? app.tracks[0];
const pageIndex = (appId) => state.apps.findIndex((app) => app.id === appId);
const focusedPage = () => state.apps.find((app) => app.id === state.focusId) ?? state.apps[0] ?? null;

const fmt = (seconds) => {
  if (seconds == null || !Number.isFinite(seconds) || seconds < 0) return "0:00";
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

function setFill(input, value) {
  input.style.setProperty("--fill", `${clamp(value, 0, 100)}%`);
}

function deviceShort(name) {
  return name.replace("Studio monitors", "Monitors");
}

/* ── deep links ──────────────────────────────────────────────── */

const params = new URLSearchParams(location.search);

if (params.get("muted") === "1") currentDevice().muted = true;

// Apps are always visible now; ?apps=1 stays a harmless default alias.
if (params.get("apps") === "0") {
  state.apps = [];
  state.focusId = null;
  state.input.consumers = [];

  for (const app of state.apps) {
    app.hasPlayer = false;
    app.playing = false;

}

if (params.get("input") === "1") state.inputOpen = true;
if (params.get("input") === "0") {
  state.input = { available: false, deviceId: null, level: 0, muted: false, consumers: [] };
  state.inputOpen = true;
}
if (params.get("mic") === "0") state.input.consumers = [];

const wantedDevice = params.get("device");
if (wantedDevice && state.devices.some((d) => d.id === wantedDevice && d.available)) {
  state.outputId = wantedDevice;
}
const wantedApp = params.get("app");
if (wantedApp) {
  const app = state.apps.find((a) => a.id === wantedApp);
  if (app) state.focusId = app.id;
}
// ?player=2 is 1-based over the app pages and wins over ?app.
const wantedPlayer = Number(params.get("player"));
if (Number.isInteger(wantedPlayer) && wantedPlayer > 0) {
  const app = state.apps[wantedPlayer - 1];
  if (app) state.focusId = app.id;
}

function routeShort(app) {
  if (app.route === "follow-preferred") return "Follow preferred";
  const device = state.devices.find((d) => d.id === app.override);
  return device ? deviceShort(device.name) : "No route";
}

function routeFull(app) {
  if (app.route === "follow-preferred") {
    return `Follow preferred · ${currentDevice().name}`;
  }
  const device = state.devices.find((d) => d.id === app.override);
  return device ? `${device.name} · Override` : "No current route";
}

/* ── toast ───────────────────────────────────────────────────── */

let toastTimer = null;
function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1900);
}

/* ── menus ───────────────────────────────────────────────────── */

let openMenuState = null; // { el, anchor }
let keyboardMode = false;
window.addEventListener("keydown", () => { keyboardMode = true; }, true);
window.addEventListener("pointerdown", () => { keyboardMode = false; }, true);

function closeMenu(restoreFocus = false) {
  if (!openMenuState) return;
  const { el, anchor } = openMenuState;
  el.remove();
  anchor.setAttribute("aria-expanded", "false");
  openMenuState = null;
  if (restoreFocus) anchor.focus();
}

function openMenu(anchor, { title, items, width = 248, align = "left" }) {
  closeMenu(false);

  const menu = document.createElement("div");
  menu.className = "menu";
  menu.setAttribute("role", "menu");
  menu.style.width = `${width}px`;

  const heading = document.createElement("div");
  heading.className = "menu-title";
  heading.textContent = title;
  menu.appendChild(heading);

  items.forEach((item, index) => {
    const button = document.createElement("button");
    button.className = "menu-item" + (item.selected ? " is-selected" : "");
    button.type = "button";
    button.dataset.i = String(index);
    button.setAttribute("role", "menuitem");
    if (item.selected) button.setAttribute("aria-current", "true");
    if (item.disabled) button.disabled = true;

    const check = document.createElement("span");
    check.className = "check";
    check.innerHTML = item.selected ? ICON.check : "";
    const name = document.createElement("span");
    name.className = "mi-name";
    name.textContent = item.label;
    button.append(check, name);
    if (item.note) {
      const note = document.createElement("span");
      note.className = "mi-note";
      note.textContent = item.note;
      button.appendChild(note);
    }
    menu.appendChild(button);
  });

  document.body.appendChild(menu);

  const rect = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let left = align === "right" ? rect.right - mw : rect.left;
  left = clamp(left, 8, window.innerWidth - mw - 8);
  let top = rect.bottom + 6;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, rect.top - mh - 6);
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;

  menu.addEventListener("click", (event) => {
    const button = event.target.closest(".menu-item");
    if (!button || button.disabled) return;
    const item = items[Number(button.dataset.i)];
    closeMenu(false);
    item.onSelect?.();
  });

  anchor.setAttribute("aria-expanded", "true");
  openMenuState = { el: menu, anchor };

  const selected = menu.querySelector(".menu-item.is-selected:not(:disabled)") ||
    menu.querySelector(".menu-item:not(:disabled)");
  if (keyboardMode) selected?.focus({ preventScroll: true });
}

/* ── render: hero ────────────────────────────────────────────── */

function renderHero() {
  const device = currentDevice();
  const muted = device.muted;

  $("outputDeviceName").textContent = device.name;
  $("outputDevice").disabled = !state.devices.some((d) => d.available);
  $("outputValue").innerHTML = `${device.level}<span class="unit">%</span>`;
  $("outputRange").value = String(device.level);
  $("outputRange").disabled = !device.available;
  setFill($("outputRange"), device.level);

  $("outputMute").innerHTML = volumeIcon(muted, device.level);
  $("outputMute").classList.toggle("is-on", muted);
  $("outputMute").setAttribute("aria-pressed", String(muted));
  $("outputMute").setAttribute("aria-label", `${muted ? "Unmute" : "Mute"} ${device.name}`);
  $("outputMute").disabled = !device.available;

  $("mutedPill").hidden = !muted;
  $("mutedNote").hidden = !muted;
  $("panel").classList.toggle("is-output-muted", muted);
}

/* ── render: audio pages ─────────────────────────────────────── */

const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function seekValue(app) {
  const track = trackOf(app);
  if (!track?.length) return 0;
  return clamp((app.position / track.length) * 1000, 0, 1000);
}

function pageHeadHTML(app) {
  const index = pageIndex(app.id) + 1;
  const live = app.hasPlayer && !app.canSeek;
  return `
    <div class="page-head">
      <span class="app-art ${app.artClass}" aria-hidden="true">${app.initial}</span>
      <div class="page-meta">
        <div class="page-name-line">
          <span class="app-name">${app.name}</span>
          ${live ? '<span class="live-badge">Live</span>' : ""}
          <span class="page-index">${index}/${state.apps.length}</span>
        </div>
        <button class="route" data-page-route="${app.id}" aria-haspopup="menu" aria-expanded="false"
                title="${routeFull(app)}" aria-label="${app.name} route: ${routeFull(app)}">
          <span class="rt">${routeShort(app)}</span>
        </button>
      </div>
    </div>`;
}

function pageTransportHTML(app) {
  const playLabel = `${app.playing ? "Pause" : "Play"} ${trackOf(app).title}`;
  return `
    <div class="transport-inline">
      <button class="tbtn" data-page-action="prev" data-page-app="${app.id}"
              aria-label="Previous track" title="Previous track"${app.canPrev ? "" : " hidden"}>${ICON.prev}</button>
      <button class="tbtn play" data-page-action="play-pause" data-page-app="${app.id}"
              aria-label="${playLabel}" title="${app.playing ? "Pause" : "Play"}">${app.playing ? ICON.pause : ICON.play}</button>
      <button class="tbtn" data-page-action="next" data-page-app="${app.id}"
              aria-label="Next track" title="Next track"${app.canNext ? "" : " hidden"}>${ICON.next}</button>
      <button class="tbtn${app.shuffle ? " is-on" : ""}" data-page-action="shuffle" data-page-app="${app.id}"
              aria-label="${app.shuffle ? "Shuffle on" : "Shuffle off"}" aria-pressed="${Boolean(app.shuffle)}"
              title="${app.shuffle ? "Shuffle on" : "Shuffle off"}"${app.shuffleSupported ? "" : " hidden"}>${ICON.shuffle}</button>
      <button class="tbtn${app.repeat !== "off" ? " is-on" : ""}" data-page-action="repeat" data-page-app="${app.id}"
              aria-label="Repeat ${app.repeat}" aria-pressed="${app.repeat !== "off"}"
              title="Repeat ${app.repeat}"${app.repeatSupported ? "" : " hidden"}>${ICON.repeat}</button>
    </div>`;
}

function pagePlayerHTML(app) {
  if (!app.hasPlayer) {
    return '<div class="page-audio-only">Audio only</div>';
  }
  const track = trackOf(app);
  return `
    <div class="page-player">
      <div class="player-strip">
        <div class="artwork ${track.art}" aria-hidden="true"></div>
        <div class="track">
          <div class="track-title" title="${track.title}">${track.title}</div>
          <div class="track-artist">${track.artist}</div>
        </div>
        ${pageTransportHTML(app)}
      </div>
      ${app.canSeek ? `
        <div class="media-seek">
          <input class="range seek-slim" type="range" min="0" max="1000" step="1"
                 value="${seekValue(app)}" data-page-seek="${app.id}"
                 style="--fill:${seekValue(app) / 10}%"
                 aria-label="${track.title} playback position"
                 aria-valuetext="${fmt(app.position)} of ${fmt(track.length)}">
          <div class="times">
            <span data-page-elapsed="${app.id}">${fmt(app.position)}</span>
            <span data-page-duration="${app.id}">${fmt(track.length)}</span>
          </div>
        </div>` : ""}
    </div>`;
}

function pageVolumeHTML(app) {
  return `
    <div class="page-volume">
      <button class="icon-btn sm${app.muted ? " is-on" : ""}" data-page-mute="${app.id}"
              aria-pressed="${app.muted}" aria-label="${app.muted ? "Unmute" : "Mute"} ${app.name}">
        ${volumeIcon(app.muted, app.volume)}
      </button>
      <input class="range secondary${app.muted ? " is-muted" : ""}" type="range" min="0" max="100" step="1"
             value="${app.volume}" data-page-range="${app.id}" style="--fill:${app.volume}%"
             aria-label="${app.name} volume">
      <span class="page-value">
        <span class="page-pct" data-page-pct="${app.id}">${app.volume}%</span>
        ${app.mixed ? '<span class="page-mixed" title="This app has streams at different levels">Mixed</span>' : ""}
      </span>
    </div>`;
}

function pageBodyHTML(app) {
  return pageHeadHTML(app) + pagePlayerHTML(app) + pageVolumeHTML(app);
}

function appPageHTML(app) {
  return `<article class="app-page" data-page="${app.id}" aria-label="${app.name}">${pageBodyHTML(app)}</article>`;
}

function setPageHeight() {
  const viewport = $("pageViewport");
  const active = viewport.querySelector(".app-page.is-active");
  if (!active) { viewport.style.height = ""; return; }
  viewport.style.height = `${active.offsetHeight}px`;
}

function updatePageAria() {
  const pages = [...$("pageTrack").querySelectorAll(".app-page")];
  const active = pageIndex(state.focusId);
  pages.forEach((page, index) => {
    const isActive = index === active;
    page.classList.toggle("is-active", isActive);
    page.setAttribute("aria-hidden", String(!isActive));
    page.inert = !isActive;
  });
  setPageHeight();
}

function scrollToFocus(smooth = true) {
  const viewport = $("pageViewport");
  const index = pageIndex(state.focusId);
  if (!viewport || index < 0) return;
  viewport.scrollTo({
    left: index * viewport.clientWidth,
    behavior: smooth && !reduceMotion() ? "smooth" : "auto",
  });
  updatePageAria();
}

function renderPages() {
  if (!state.apps.some((app) => app.id === state.focusId)) {
    state.focusId = state.apps[0]?.id ?? null;
  }

  $("appsCount").textContent = String(state.apps.length);
  const multi = state.apps.length > 1;
  $("prevPage").hidden = !multi;
  $("nextPage").hidden = !multi;

  const track = $("pageTrack");
  if (state.apps.length === 0) {
    $("pageViewport").style.height = "";
    track.innerHTML = `
      <div class="audio-empty">
        <div class="artwork art-empty empty-art" aria-hidden="true"></div>
        <div>
          <div class="t">No apps playing</div>
          <div class="s">Apps with audio show up here with their own volume and route.</div>
        </div>
      </div>`;
    return;
  }

  track.innerHTML = state.apps.map(appPageHTML).join("");
  updatePageAria();
  requestAnimationFrame(() => scrollToFocus(false));
}

function updatePage(app) {
  const page = $("pageTrack").querySelector(`[data-page="${app.id}"]`);
  if (!page) return;
  page.innerHTML = pageBodyHTML(app);
  updatePageAria();
}

function updatePageSeek(app) {
  const page = $("pageTrack").querySelector(`[data-page="${app.id}"]`);
  const seek = page?.querySelector(`[data-page-seek="${app.id}"]`);
  if (!seek || !app.canSeek) return;
  const track = trackOf(app);
  if (!track?.length) return;
  const value = seekValue(app);
  seek.value = String(value);
  setFill(seek, value / 10);
  seek.setAttribute("aria-valuetext", `${fmt(app.position)} of ${fmt(track.length)}`);
  page.querySelector(`[data-page-elapsed="${app.id}"]`).textContent = fmt(app.position);
  page.querySelector(`[data-page-duration="${app.id}"]`).textContent = fmt(track.length);
}

function updatePageMute(app) {
  const page = $("pageTrack").querySelector(`[data-page="${app.id}"]`);
  const button = page?.querySelector(`[data-page-mute="${app.id}"]`);
  if (!button) return;
  button.innerHTML = volumeIcon(app.muted, app.volume);
  button.classList.toggle("is-on", app.muted);
  button.setAttribute("aria-pressed", String(app.muted));
  button.setAttribute("aria-label", `${app.muted ? "Unmute" : "Mute"} ${app.name}`);
}

function updatePageRoute(app) {
  const page = $("pageTrack").querySelector(`[data-page="${app.id}"]`);
  const chip = page?.querySelector(`[data-page-route="${app.id}"]`);
  if (!chip) return;
  chip.querySelector(".rt").textContent = routeShort(app);
  chip.title = routeFull(app);
  chip.setAttribute("aria-label", `${app.name} route: ${routeFull(app)}`);
}

function updateAllRouteChips() {
  for (const app of state.apps) updatePageRoute(app);
}

/* ── render: input ───────────────────────────────────────────── */

function renderInput() {
  const input = state.input;
  const head = $("inputHead");
  const body = $("inputBody");
  const device = currentInput();
  const available = input.available;
  const name = device?.name ?? "No input available";

  head.setAttribute("aria-expanded", String(state.inputOpen));
  $("inputSummary").textContent = available
    ? (input.muted ? `${name} · Muted` : name)
    : "No input available";
  $("inputDot").hidden = !(available && input.consumers.length > 0);

  body.hidden = !state.inputOpen;
  if (!state.inputOpen) return;

  $("inputDeviceName").textContent = name;
  $("inputDevice").disabled = !available;
  $("inputMute").innerHTML = input.muted ? ICON.micMute : ICON.mic;
  $("inputMute").classList.toggle("is-on", input.muted);
  $("inputMute").disabled = !available;
  $("inputMute").setAttribute("aria-pressed", String(input.muted));
  $("inputMute").setAttribute("aria-label", `${input.muted ? "Unmute" : "Mute"} ${name}`);

  $("inputRange").value = String(input.level);
  $("inputRange").disabled = !available;
  $("inputRange").classList.toggle("is-muted", input.muted);
  setFill($("inputRange"), input.level);
  $("inputValue").textContent = available ? `${input.level}%` : "—";

  const consumer = input.consumers[0];
  $("micConsumer").hidden = !(available && consumer);
  if (consumer) {
    $("micConsumer").querySelector(".who").textContent = consumer.name;
    $("micConsumer").querySelector(".mini-art").className = `mini-art ${consumer.artClass}`;
  }
  $("inputEmpty").hidden = Boolean(consumer) && available;
  $("inputEmpty").textContent = available ? "No microphone use right now." : "No microphone detected.";
}

/* ── render: bar ─────────────────────────────────────────────── */

function renderBar() {
  const device = currentDevice();
  const volumeBtn = $("barVolume");
  volumeBtn.innerHTML = volumeIcon(device.muted, device.level);
  volumeBtn.classList.toggle("is-active", state.panelOpen);
  volumeBtn.setAttribute("aria-expanded", String(state.panelOpen));
  volumeBtn.setAttribute("aria-label",
    `Sound, ${device.name}, ${device.muted ? "muted" : `${device.level} percent`}`);

  const mic = $("barMic");
  const live = state.input.available && state.input.consumers.length > 0;
  mic.hidden = !live;
  mic.setAttribute("aria-label", state.input.muted
    ? "Microphone in use, muted"
    : "Microphone in use");
}

/* ── render all ──────────────────────────────────────────────── */

function renderAll() {
  renderHero();
  renderPages();
  renderInput();
  renderBar();
}

/* ── panel open / close ──────────────────────────────────────── */

function setPanelOpen(open, { toastOnClose = false } = {}) {
  state.panelOpen = open;
  document.body.classList.toggle("is-closed", !open);
  if (!open) closeMenu(false);
  renderBar();
  if (!open && toastOnClose) toast("Sound closed — click the speaker to reopen");
}

/* ── device & route menus ────────────────────────────────────── */

function openOutputMenu() {
  const anchor = $("outputDevice");
  if (openMenuState?.anchor === anchor) { closeMenu(true); return; }
  const current = currentDevice();
  openMenu(anchor, {
    title: "Output device",
    width: 252,
    items: state.devices.map((device) => ({
      label: device.name,
      note: device.available ? (device.id === current.id ? "Selected" : "") : "Unavailable",
      selected: device.id === current.id,
      disabled: !device.available,
      onSelect: () => {
        state.outputId = device.id;
        renderHero();
        updateAllRouteChips();
        renderBar();
        toast(`Output · ${device.name}`);
      }
    }))
  });
}

function openInputMenu() {
  const anchor = $("inputDevice");
  if (openMenuState?.anchor === anchor) { closeMenu(true); return; }
  const current = currentInput();
  openMenu(anchor, {
    title: "Input device",
    width: 252,
    items: state.inputs.map((device) => ({
      label: device.name,
      note: device.available ? (device.id === current?.id ? "Selected" : "") : "Unavailable",
      selected: device.id === current?.id,
      disabled: !device.available,
      onSelect: () => {
        state.input.deviceId = device.id;
        renderInput();
        toast(`Input · ${device.name}`);
      }
    }))
  });
}

function openRouteMenu(app, anchor) {
  if (openMenuState?.anchor === anchor) { closeMenu(true); return; }
  openMenu(anchor, {
    title: `${app.name} output route`,
    width: 248,
    items: [
      {
        label: `Follow preferred · ${currentDevice().name}`,
        selected: app.route === "follow-preferred",
        onSelect: () => {
          app.route = "follow-preferred";
          app.override = null;
          updatePageRoute(app);
          toast(`${app.name} follows ${currentDevice().name}`);
        }
      },
      ...state.devices.map((device) => ({
        label: device.available ? `${device.name} · Override` : device.name,
        note: device.available ? "" : "Unavailable",
        selected: app.route === "explicit" && app.override === device.id,
        disabled: !device.available,
        onSelect: () => {
          app.route = "explicit";
          app.override = device.id;
          updatePageRoute(app);
          toast(`${app.name} routed to ${device.name}`);
        }
      }))
    ]
  });
}

/* ── page actions ────────────────────────────────────────────── */

function changeTrack(app, delta) {
  if (!app?.hasPlayer) return;
  if (delta < 0 && app.position > 5) {
    app.position = 0;
  } else {
    app.trackIndex = (app.trackIndex + delta + app.tracks.length) % app.tracks.length;
    app.position = 0;
  }
  updatePage(app);
}

function pageAction(app, action) {
  if (!app) return;
  if (action === "play-pause") {
    if (!app.hasPlayer) return;
    app.playing = !app.playing;
    updatePage(app);
    return;
  }
  if (action === "prev") { changeTrack(app, -1); return; }
  if (action === "next") { changeTrack(app, 1); return; }
  if (action === "shuffle") {
    if (!app.shuffleSupported) return;
    app.shuffle = !app.shuffle;
    updatePage(app);
    return;
  }
  if (action === "repeat") {
    if (!app.repeatSupported) return;
    const order = ["off", "all", "one"];
    app.repeat = order[(order.indexOf(app.repeat) + 1) % order.length];
    updatePage(app);
  }
}

function goToPage(delta) {
  if (state.apps.length <= 1) return;
  const current = Math.max(0, pageIndex(state.focusId));
  const next = (current + delta + state.apps.length) % state.apps.length;
  state.focusId = state.apps[next].id;
  scrollToFocus(false);
}

/* ── wiring ──────────────────────────────────────────────────── */

$("barVolume").addEventListener("click", () => {
  setPanelOpen(!state.panelOpen);
});

$("barMic").addEventListener("click", () => {
  state.inputOpen = true;
  setPanelOpen(true);
  renderInput();
});

$("outputMute").addEventListener("click", () => {
  const device = currentDevice();
  if (!device.available) return;
  device.muted = !device.muted;
  renderHero();
  renderBar();
});

$("outputDevice").addEventListener("click", openOutputMenu);

$("outputRange").addEventListener("input", (event) => {
  const device = currentDevice();
  if (!device.available) return;
  device.level = Number(event.target.value);
  $("outputValue").innerHTML = `${device.level}<span class="unit">%</span>`;
  setFill(event.target, device.level);
  event.target.setAttribute("aria-valuetext", `${device.level} percent`);
  renderBar();
});

$("inputHead").addEventListener("click", () => {
  state.inputOpen = !state.inputOpen;
  renderInput();
});

$("inputDevice").addEventListener("click", openInputMenu);

$("inputMute").addEventListener("click", () => {
  if (!state.input.available) return;
  state.input.muted = !state.input.muted;
  renderInput();
  renderBar();
});

$("inputRange").addEventListener("input", (event) => {
  if (!state.input.available) return;
  state.input.level = Number(event.target.value);
  $("inputValue").textContent = `${state.input.level}%`;
  setFill(event.target, state.input.level);
  event.target.setAttribute("aria-valuetext", `${state.input.level} percent`);
});

let seekingAppId = null;
let scrollTimer = null;

$("prevPage").addEventListener("click", () => goToPage(-1));
$("nextPage").addEventListener("click", () => goToPage(1));

/* Page controls are delegated because pages are (re)built on state changes. */
$("pageTrack").addEventListener("click", (event) => {
  const action = event.target.closest("[data-page-action]");
  if (action) {
    const app = state.apps.find((a) => a.id === action.dataset.pageApp);
    pageAction(app, action.dataset.pageAction);
    return;
  }

  const mute = event.target.closest("[data-page-mute]");
  if (mute) {
    const app = state.apps.find((a) => a.id === mute.dataset.pageMute);
    if (!app) return;
    app.muted = !app.muted;
    updatePageMute(app);
    return;
  }

  const route = event.target.closest("[data-page-route]");
  if (route) {
    const app = state.apps.find((a) => a.id === route.dataset.pageRoute);
    if (app) openRouteMenu(app, route);
  }
});

$("pageTrack").addEventListener("input", (event) => {
  const seek = event.target.closest("[data-page-seek]");
  if (seek) {
    const app = state.apps.find((a) => a.id === seek.dataset.pageSeek);
    if (!app?.canSeek) return;
    const track = trackOf(app);
    if (!track?.length) return;
    seekingAppId = app.id;
    app.position = (Number(seek.value) / 1000) * track.length;
    const page = $("pageTrack").querySelector(`[data-page="${app.id}"]`);
    page.querySelector(`[data-page-elapsed="${app.id}"]`).textContent = fmt(app.position);
    setFill(seek, Number(seek.value) / 10);
    return;
  }

  const range = event.target.closest("[data-page-range]");
  if (!range) return;
  const app = state.apps.find((a) => a.id === range.dataset.pageRange);
  if (!app) return;
  app.volume = Number(range.value);
  setFill(range, app.volume);
  range.setAttribute("aria-valuetext", `${app.volume} percent`);
  const pct = $("pageTrack").querySelector(`[data-page-pct="${app.id}"]`);
  if (pct) pct.textContent = `${app.volume}%`;
});

$("pageTrack").addEventListener("change", (event) => {
  if (event.target.closest("[data-page-seek]")) seekingAppId = null;
});
$("pageTrack").addEventListener("pointerup", (event) => {
  if (event.target.closest("[data-page-seek]")) seekingAppId = null;
});

/* Horizontal swipe/scroll updates the focused page for arrows and ?player. */
const pageViewport = $("pageViewport");
pageViewport.addEventListener("scroll", () => {
  closeMenu(false);
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    if (!state.apps.length) return;
    const width = pageViewport.clientWidth;
    if (!width) return;
    const index = clamp(Math.round(pageViewport.scrollLeft / width), 0, state.apps.length - 1);
    const app = state.apps[index];
    if (app && app.id !== state.focusId) {
      state.focusId = app.id;
      updatePageAria();
    }
  }, 80);
}, { passive: true });

/* ── outside click / Esc / scrolling ─────────────────────────── */

document.addEventListener("click", (event) => {
  if (openMenuState && !event.target.closest(".menu") && !openMenuState.anchor.contains(event.target)) {
    closeMenu(false);
  }

  if (!state.panelOpen) return;
  if (event.target.closest("#panel") || event.target.closest(".menu") || event.target.closest("#barVolume")) return;
  setPanelOpen(false, { toastOnClose: true });
});

$("popScroll").addEventListener("scroll", () => closeMenu(false), { passive: true });
window.addEventListener("resize", () => {
  closeMenu(false);
  requestAnimationFrame(() => scrollToFocus(false));
});

window.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;

  if (openMenuState) {
    event.preventDefault();
    closeMenu(true);
    return;
  }

  if (state.panelOpen) {
    event.preventDefault();
    setPanelOpen(false, { toastOnClose: true });
  }
});

/* ── live simulation ─────────────────────────────────────────── */

setInterval(() => {
  for (const app of state.apps) {
    if (!app.hasPlayer || !app.playing || !app.canSeek || app.id === seekingAppId) continue;
    const track = trackOf(app);
    if (!track?.length) continue;
    app.position = Math.min(track.length, app.position + 1);
    if (app.position >= track.length) {
      app.position = 0;
      app.trackIndex = (app.trackIndex + 1) % app.tracks.length;
      updatePage(app);
      continue;
    }
    updatePageSeek(app);
  }
}, 1000);

/* ── boot ────────────────────────────────────────────────────── */

setPanelOpen(true);
renderAll();
</script>
</body>
</html>
