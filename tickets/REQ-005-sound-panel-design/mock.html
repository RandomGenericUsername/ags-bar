<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sound — anchored popover prototype</title>
<style>
/* ============================================================
   SOUND — the AGS bar's audio popover, redesigned onto the same
   visual contract as the wallpaper selector (106) and clipboard
   (107) overlays:

     · one glass chrome layer: surface + 1px hairline + soft shadow
     · no accent frame; accent is for state and action only
     · ink / dim / faint type, sentence case, no uppercase labels
     · 8px rhythm, 18px panel radius, 10.5/11.5/13/15/28 type
     · 40–44px primary targets; every pointer action has a key
     · content is the surface; the desktop stays visible behind it

   ANCHORED, NOT FULL-SCREEN. A 352px popover hangs under the
   bar's volume indicator with an 8px gap. Clicking the wallpaper
   or pressing Esc closes it; the bar icon toggles it back.

   SKIN / APPEARANCE MAPPING (for the parallel skin work):
   the chrome colour roles and the radii are custom properties on
   :root. The appearance layer can remap:
     ink / ink-dim / ink-faint   -> palette on-surface ramp
     glass / glass-strong        -> palette surface at two opacities
     hairline                    -> palette outline at low alpha
     accent / on-accent          -> palette primary / on-primary
     live                        -> semantic green (not palette)
     r-panel                     -> surface.panel.radius
     r-card                      -> surface.card.radius
     r-cell                      -> surface.cell.radius
     r-control                   -> surface.control.radius
     r-pill                      -> surface.pill.radius
   panel-w is an app literal (352px), not a skin layout token. It
   would need a layout.ags.audio-panel-width token before it can be
   remapped. Some translucent hover/fill overlays and all content
   art (wallpaper, album covers, app tiles) remain literals.

   ROLE NOTE (2026-11-11, W-10). The popover, the tray dropdown and the
   settings popover are AGS layer-shell surfaces in the bar's ags
   instance, not compositor toplevels, so they are surface.panel — never
   surface.window. List rows are surface.cell (r-cell); the Playing page
   is surface.card; buttons/fields are surface.control; badges are
   surface.pill.
   ============================================================ */

:root {
  /* ink */
  --ink: #f6f5f8;
  --ink-dim: rgba(246, 245, 248, .62);
  --ink-faint: rgba(246, 245, 248, .40);

  /* chrome */
  --hairline: rgba(255, 255, 255, .13);
  --hairline-soft: rgba(255, 255, 255, .07);
  --glass: rgba(9, 9, 13, .70);
  --glass-strong: rgba(12, 12, 17, .94);
  --control-bg: rgba(255, 255, 255, .055);
  --control-hover: rgba(255, 255, 255, .10);
  --inset-bg: rgba(255, 255, 255, .045);

  /* state + action */
  --accent: #ff8a6a;
  --on-accent: #1a0b06;
  --live: #4ade80;

  /* geometry — panel-w is an app literal; the radii are skin roles */
  --panel-w: 352px;
  --bar-h: 40px;
  --gap: 8px;
  --r-panel: 18px;   /* surface.panel.radius */
  --r-card: 12px;    /* surface.card.radius */
  --r-cell: 8px;     /* surface.cell.radius */
  --r-control: 9px;  /* surface.control.radius */
  --r-pill: 999px;   /* surface.pill.radius */

  /* shared aliases used by the panel/menu chrome */
  --surface: var(--glass);
  --surface-strong: var(--glass-strong);
  --outline: var(--hairline);
  --focus-ring: var(--accent);
  --track: rgba(255, 255, 255, .16);
  --track-strong: rgba(255, 255, 255, .58);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #050407;
  color: var(--ink);
  font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
               "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; color: inherit; }
button {
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { cursor: default; }

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

kbd {
  font: inherit;
  font-size: 9.5px;
  font-weight: 650;
  line-height: 1;
  color: var(--ink-dim);
  background: rgba(255, 255, 255, .08);
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 5px;
  padding: 3px 5px;
}

/* ── the desktop ─────────────────────────────────────────────── */

/* Dragon CSS art, reused verbatim from the wallpaper selector mock
   (106, spikes/wallpaper-selector-overlay/index.html). It is the
   live wallpaper behind the bar, not a scrim. */
#wall {
  position: fixed;
  inset: -2%;
  z-index: 0;
  background-image:
    radial-gradient(90% 80% at 22% 12%, #5b2f8a 0%, transparent 58%),
    radial-gradient(70% 70% at 78% 28%, #c23a72 0%, transparent 55%),
    radial-gradient(60% 50% at 52% 92%, #ff7a59 0%, transparent 60%),
    linear-gradient(155deg, #0d0716 0%, #241033 45%, #090510 100%);
  background-size: cover;
  background-position: center;
  transform: scale(1.02);
}

/* Edges only. The wallpaper stays the wallpaper. */
.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(125% 100% at 58% 40%, transparent 52%, rgba(0, 0, 0, .40) 100%),
    linear-gradient(to bottom, rgba(0, 0, 0, .18), transparent 22%);
}

/* ── faux AGS bar ────────────────────────────────────────────── */

.desktopbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  height: var(--bar-h);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
  background: rgba(8, 8, 12, .52);
  border-bottom: 1px solid rgba(255, 255, 255, .08);
  backdrop-filter: blur(22px) saturate(1.2);
  font-size: 11px;
  color: rgba(255, 255, 255, .62);
}

.db-left { display: flex; align-items: center; gap: 3px; }
.db-ws {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.db-ws.active { background: rgba(255, 255, 255, .14); color: var(--ink); }

.db-center {
  font-size: 11.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, .84);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.db-right {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 4px;
}

.db-btn {
  width: 30px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: rgba(255, 255, 255, .72);
  transition: background .16s, color .16s;
}
.db-btn:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }
.db-btn.is-active { background: rgba(255, 255, 255, .13); color: var(--ink); }

.db-mic { position: relative; }
.db-mic .live-dot {
  position: absolute;
  top: 4px;
  right: 4px;
}

/* ── tray: now-playing status icon + dropdown ───────────────── */

.tray {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 0 2px;
}
.tray[hidden] { display: none; }

.tray-strip {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 38px;
  max-width: 340px;
  min-width: 0;
  padding: 0 4px;
  border-radius: 8px;
  transition: background .16s;
  cursor: pointer;
}
.tray-strip:hover { background: rgba(255, 255, 255, .06); }

.tray-strip-main {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  text-align: left;
  color: inherit;
}
.tray-strip-main:focus-visible { outline-offset: 1px; }

.tray-art {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background-size: cover;
  background-position: center;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .20);
}
.tray-strip-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.tray-strip-title {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.1;
  color: rgba(255, 255, 255, .90);
}
.tray-strip-artist {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 10.5px;
  line-height: 1.1;
  color: rgba(255, 255, 255, .58);
}

.tray-strip-controls {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 0;
}
.tray-strip-btn {
  width: 22px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  color: rgba(255, 255, 255, .66);
  transition: background .16s, color .16s;
}
.tray-strip-btn:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }
.tray-strip-btn.is-on { color: var(--accent); background: rgba(255, 138, 106, .10); }
.tray-strip-btn[hidden] { display: none; }
.tray-strip-btn.play {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
}
.tray-strip-btn.play:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.06); }

/* Quiet reserved-tray placeholders. */
.tray-placeholder {
  pointer-events: none;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .22);
}

/* Settings popover, anchored to the Output gear. */
.settings-pop {
  position: fixed;
  z-index: 66;
  width: 280px;
  padding: 14px;
  border-radius: var(--r-panel);
  background: var(--surface-strong);
  border: 1px solid var(--outline);
  backdrop-filter: blur(28px) saturate(1.2);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .56);
}
.settings-pop[hidden] { display: none; }
.settings-head {
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: 650;
  color: var(--ink);
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 0;
  border-top: 1px solid var(--hairline-soft);
  border-radius: var(--r-cell);
}
.settings-text { min-width: 0; }
.settings-name {
  font-size: 11.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, .88);
}
.settings-help {
  margin-top: 3px;
  font-size: 10.5px;
  line-height: 1.4;
  color: var(--ink-faint);
}
.switch {
  position: relative;
  flex: 0 0 auto;
  width: 38px;
  height: 22px;
  padding: 0;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .14);
  transition: background .16s, border-color .16s;
}
.switch-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fbfafc;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
  transition: transform .16s, background .16s;
}
.switch[aria-checked="true"] {
  background: var(--accent);
  border-color: transparent;
}
.switch[aria-checked="true"] .switch-knob {
  transform: translateX(16px);
  background: var(--on-accent);
}
.switch:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.settings-foot {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--hairline-soft);
  font-size: 10.5px;
  color: var(--ink-faint);
}

/* Brief scroll cue, below the bar; never affects bar height. */
.tray-cue {
  position: fixed;
  z-index: 70;
  top: calc(var(--bar-h) + 6px);
  right: 12px;
  padding: 5px 9px;
  border-radius: var(--r-pill);
  background: var(--surface-strong);
  border: 1px solid var(--outline);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .42);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink);
  opacity: 0;
  transform: translateY(-3px);
  pointer-events: none;
  transition: opacity .16s, transform .16s;
}
.tray-cue.show { opacity: 1; transform: none; }

/* Dropdown: menu-like, anchored under the tray icon. */
.tray-pop {
  position: fixed;
  z-index: 65;
  width: 300px;
  max-height: calc(100vh - 52px);
  overflow-y: auto;
  padding: 12px;
  border-radius: var(--r-panel);
  background: var(--surface-strong);
  border: 1px solid var(--outline);
  backdrop-filter: blur(28px) saturate(1.2);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .56);
}
.tray-pop[hidden] { display: none; }

.tray-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 2px 8px;
}
.tray-caption {
  flex: 0 0 auto;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-faint);
}
.tray-source {
  margin-left: auto;
  min-width: 0;
  max-width: 160px;
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--ink-dim);
  font-size: 10.5px;
}
.tray-source-art {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  display: grid;
  place-items: center;
  border-radius: 4px;
  font-size: 7.5px;
  font-weight: 700;
  color: rgba(255, 255, 255, .94);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
}
.tray-source-name {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.tray-track-row {
  display: flex;
  align-items: center;
  gap: 9px;
}
.tray-artwork {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border-radius: var(--r-control);
  background-size: cover;
  background-position: center;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13);
}
.tray-meta { flex: 1; min-width: 0; display: grid; gap: 1px; }
.tray-title {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 600;
}
.tray-artist {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 10.5px;
  color: var(--ink-dim);
}

.tray-transport {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1px;
  margin-top: 4px;
}
.tray-btn {
  width: 30px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: var(--r-control);
  color: var(--ink-dim);
  transition: background .16s, color .16s;
}
.tray-btn:hover { background: var(--control-hover); color: var(--ink); }
.tray-btn.is-on { color: var(--accent); background: rgba(255, 138, 106, .10); }
.tray-btn.play {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
}
.tray-btn.play:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.06); }

.tray-seek { margin-top: 2px; }
.tray-times {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: -1px;
  padding: 0 1px;
  font-size: 9.5px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.tray-divider {
  border-top: 1px solid var(--hairline-soft);
  margin: 8px 0 4px;
}
.tray-players-head {
  padding: 2px 4px 4px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-faint);
}
.tray-player {
  width: 100%;
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 4px;
  border-radius: var(--r-cell);
  text-align: left;
  transition: background .16s;
}
.tray-player:hover { background: var(--control-hover); }
.tray-player.is-active { background: rgba(255, 255, 255, .045); }
.tray-player .app-art {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  font-size: 8.5px;
}
.tray-player-meta { flex: 1; min-width: 0; display: grid; gap: 0; }
.tray-player-name-line {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}
.tray-player-name {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.1;
}
.tray-player-track {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 10.5px;
  color: var(--ink-faint);
  line-height: 1.1;
}
.tray-check {
  flex: 0 0 14px;
  display: grid;
  place-items: center;
  color: var(--accent);
}

.tray-foot {
  border-top: 1px solid var(--hairline-soft);
  margin-top: 6px;
  padding-top: 6px;
}
.tray-open {
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 6px;
  border-radius: 8px;
  color: var(--ink-dim);
  font-size: 11.5px;
  font-weight: 600;
  text-align: left;
  transition: background .16s, color .16s;
}
.tray-open:hover { background: var(--control-hover); color: var(--ink); }
.tray-open svg { color: var(--ink-faint); }

/* ── the popover ─────────────────────────────────────────────── */

.audio-pop {
  position: fixed;
  top: calc(var(--bar-h) + var(--gap));
  right: 12px;
  z-index: 30;
  width: min(var(--panel-w), calc(100vw - 24px));
  max-height: calc(100vh - var(--bar-h) - var(--gap) - 12px);
  display: flex;
  flex-direction: column;
  border-radius: var(--r-panel);
  background: var(--surface);
  border: 1px solid var(--outline);
  backdrop-filter: blur(30px) saturate(1.3);
  box-shadow:
    0 24px 64px rgba(0, 0, 0, .50),
    0 3px 10px rgba(0, 0, 0, .26);
  overflow: hidden;
  transform-origin: top right;
  transition: opacity .22s ease, transform .22s ease;
}

body.is-closed .audio-pop {
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px) scale(.985);
  pointer-events: none;
}

.pop-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, .18) transparent;
}
.pop-scroll::-webkit-scrollbar { width: 8px; }
.pop-scroll::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, .16);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
}

/* ── hero: output ────────────────────────────────────────────── */

.hero {
  flex: 0 0 auto;
  padding: 10px 16px 10px;
  border-bottom: 1px solid var(--hairline-soft);
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 24px;
  margin-bottom: 4px;
}

.caption-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.caption {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-dim);
}

.muted-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--r-pill);
  background: rgba(255, 138, 106, .14);
  color: #ffd0c2;
  font-size: 10.5px;
  font-weight: 650;
}
.muted-pill::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: var(--r-control);
  color: var(--ink-dim);
  background: transparent;
  transition: background .16s, color .16s;
}
.icon-btn:hover { background: var(--control-hover); color: var(--ink); }
.icon-btn.is-active { background: var(--control-hover); color: var(--ink); }
.icon-btn.is-on {
  color: var(--accent);
  background: rgba(255, 138, 106, .12);
}
.icon-btn.sm {
  width: 40px;
  height: 40px;
  border-radius: var(--r-control);
}
.hero-actions { display: flex; align-items: center; gap: 2px; }
.icon-btn:disabled { opacity: .36; }

.device {
  width: 100%;
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 10px;
  border-radius: var(--r-control);
  background: var(--control-bg);
  color: var(--ink);
  text-align: left;
  transition: background .16s, color .16s;
}
.device:hover { background: var(--control-hover); }
.device:disabled { opacity: .48; }
.device .dev-icon { flex: 0 0 auto; color: var(--ink-dim); }
.device .dev-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13px;
  font-weight: 600;
}
.device .dev-note {
  flex: 0 0 auto;
  font-size: 10.5px;
  color: var(--ink-faint);
}
.device .chev { flex: 0 0 auto; color: var(--ink-faint); }

.level-row {
  display: grid;

const trayPlayer = () => playingPage();
let trayCueTimer = null;

const fmt = (seconds) => {
  if (seconds == null || !Number.isFinite(seconds) || seconds < 0) return "0:00";
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

function setFill(input, value) {
  input.style.setProperty("--fill", `${clamp(value, 0, 100)}%`);
}

function deviceShort(name) {
  return name.replace("Studio monitors", "Monitors");
}

/* ── deep links ──────────────────────────────────────────────── */

const params = new URLSearchParams(location.search);

if (params.get("muted") === "1") currentDevice().muted = true;

// ?apps=1 is a harmless default alias; the deck always shows the list.
if (params.get("apps") === "0") {
  state.apps = [];
  state.playingId = null;
  state.mixFocusId = null;
  state.input.consumers = [];
}

if (params.get("playing") === "0") {
  for (const app of state.apps) {
    app.hasPlayer = false;
    app.playing = false;
  }
}

if (params.get("input") === "1") state.inputOpen = true;
if (params.get("input") === "0") {
  state.input = { available: false, deviceId: null, level: 0, muted: false, consumers: [] };
  state.inputOpen = true;
}
if (params.get("mic") === "0") state.input.consumers = [];

const wantedWidget = params.get("widget");
if (wantedWidget === "0") state.mediaWidgetEnabled = false;
if (wantedWidget === "1") state.mediaWidgetEnabled = true;

const wantedDevice = params.get("device");
if (wantedDevice && state.devices.some((d) => d.id === wantedDevice && d.available)) {
  state.outputId = wantedDevice;
}

const modeParam = params.get("mode");
const wantedApp = params.get("app");
const wantedPlayer = Number(params.get("player"));
const pages = playingApps();

// Default: Playing when a player exists, otherwise Mixer.
let mode = pages.length ? "playing" : "mixer";
if (modeParam === "playing" || modeParam === "mixer") mode = modeParam;

if (Number.isInteger(wantedPlayer) && wantedPlayer > 0) {
  const app = pages[wantedPlayer - 1];
  if (app) {
    state.playingId = app.id;
    if (!modeParam) mode = "playing";
  }
}

if (wantedApp) {
  const app = appById(wantedApp);
  if (app) {
    state.mixFocusId = app.id;
    if (app.hasPlayer) {
      state.playingId = app.id;
      if (!modeParam) mode = "playing";
    } else {
      // Audio-only apps have no Playing page; focus them in Mixer.
      mode = "mixer";
    }
  }
}

if (!pages.some((app) => app.id === state.playingId)) {
  state.playingId = pages[0]?.id ?? null;
}
state.mode = mode;

function routeShort(app) {
  if (app.route === "follow-preferred") return "Follow preferred";
  const device = state.devices.find((d) => d.id === app.override);
  return device ? deviceShort(device.name) : "No route";
}

function routeFull(app) {
  if (app.route === "follow-preferred") {
    return `Follow preferred · ${currentDevice().name}`;
  }
  const device = state.devices.find((d) => d.id === app.override);
  return device ? `${device.name} · Override` : "No current route";
}

/* ── toast ───────────────────────────────────────────────────── */

let toastTimer = null;
function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1900);
}

/* ── menus ───────────────────────────────────────────────────── */

let openMenuState = null; // { el, anchor }
let keyboardMode = false;
window.addEventListener("keydown", () => { keyboardMode = true; }, true);
window.addEventListener("pointerdown", () => { keyboardMode = false; }, true);

function closeMenu(restoreFocus = false) {
  if (!openMenuState) return;
  const { el, anchor } = openMenuState;
  el.remove();
  anchor.setAttribute("aria-expanded", "false");
  openMenuState = null;
  if (restoreFocus) anchor.focus();
}

function openMenu(anchor, { title, items, width = 248, align = "left" }) {
  closeMenu(false);

  const menu = document.createElement("div");
  menu.className = "menu";
  menu.setAttribute("role", "menu");
  menu.style.width = `${width}px`;

  const heading = document.createElement("div");
  heading.className = "menu-title";
  heading.textContent = title;
  menu.appendChild(heading);

  items.forEach((item, index) => {
    const button = document.createElement("button");
    button.className = "menu-item" + (item.selected ? " is-selected" : "");
    button.type = "button";
    button.dataset.i = String(index);
    button.setAttribute("role", "menuitem");
    if (item.selected) button.setAttribute("aria-current", "true");
    if (item.disabled) button.disabled = true;

    const check = document.createElement("span");
    check.className = "check";
    check.innerHTML = item.selected ? ICON.check : "";
    const name = document.createElement("span");
    name.className = "mi-name";
    name.textContent = item.label;
    button.append(check, name);
    if (item.note) {
      const note = document.createElement("span");
      note.className = "mi-note";
      note.textContent = item.note;
      button.appendChild(note);
    }
    menu.appendChild(button);
  });

  document.body.appendChild(menu);

  const rect = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let left = align === "right" ? rect.right - mw : rect.left;
  left = clamp(left, 8, window.innerWidth - mw - 8);
  let top = rect.bottom + 6;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, rect.top - mh - 6);
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;

  menu.addEventListener("click", (event) => {
    const button = event.target.closest(".menu-item");
    if (!button || button.disabled) return;
    const item = items[Number(button.dataset.i)];
    closeMenu(false);
    item.onSelect?.();
  });

  anchor.setAttribute("aria-expanded", "true");
  openMenuState = { el: menu, anchor };

  const selected = menu.querySelector(".menu-item.is-selected:not(:disabled)") ||
    menu.querySelector(".menu-item:not(:disabled)");
  if (keyboardMode) selected?.focus({ preventScroll: true });
}

/* ── render: hero ────────────────────────────────────────────── */

function renderHero() {
  const device = currentDevice();
  const muted = device.muted;

  $("outputDeviceName").textContent = device.name;
  $("outputDevice").disabled = !state.devices.some((d) => d.available);
  $("outputValue").innerHTML = `${device.level}<span class="unit">%</span>`;
  $("outputRange").value = String(device.level);
  $("outputRange").disabled = !device.available;
  setFill($("outputRange"), device.level);

  $("outputMute").innerHTML = volumeIcon(muted, device.level);
  $("outputMute").classList.toggle("is-on", muted);
  $("outputMute").setAttribute("aria-pressed", String(muted));
  $("outputMute").setAttribute("aria-label", `${muted ? "Unmute" : "Mute"} ${device.name}`);
  $("outputMute").disabled = !device.available;

  $("mutedPill").hidden = !muted;
  $("panel").classList.toggle("is-output-muted", muted);
}

/* ── render: deck (Playing | Mixer) ──────────────────────────── */

const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function seekValue(app) {
  const track = trackOf(app);
  if (!track?.length) return 0;
  return clamp((app.position / track.length) * 1000, 0, 1000);
}

/* Playing mode: one page per app with a current player. */

function playingHeadHTML(app) {
  const pages = playingApps();
  const index = playingIndex(app.id) + 1;
  const live = !app.canSeek;
  return `
    <div class="playing-head">
      <div class="playing-meta">
        <span class="app-name">${app.name}</span>
        ${live ? '<span class="live-badge">Live</span>' : ""}
        <span class="page-index">${index}/${pages.length}</span>
      </div>
    </div>`;
}

function playingTransportHTML(app) {
  const track = trackOf(app);
  const playLabel = `${app.playing ? "Pause" : "Play"} ${track.title}`;
  return `
    <div class="transport-inline">
      <button class="tbtn" data-playing-action="prev" data-playing-app="${app.id}"
              aria-label="Previous track" title="Previous track"${app.canPrev ? "" : " hidden"}>${ICON.prev}</button>
      <button class="tbtn play" data-playing-action="play-pause" data-playing-app="${app.id}"
              aria-label="${playLabel}" title="${app.playing ? "Pause" : "Play"}">${app.playing ? ICON.pause : ICON.play}</button>
      <button class="tbtn" data-playing-action="next" data-playing-app="${app.id}"
              aria-label="Next track" title="Next track"${app.canNext ? "" : " hidden"}>${ICON.next}</button>
      <button class="tbtn${app.shuffle ? " is-on" : ""}" data-playing-action="shuffle" data-playing-app="${app.id}"
              aria-label="${app.shuffle ? "Shuffle on" : "Shuffle off"}" aria-pressed="${Boolean(app.shuffle)}"
              title="${app.shuffle ? "Shuffle on" : "Shuffle off"}"${app.shuffleSupported ? "" : " hidden"}>${ICON.shuffle}</button>
      <button class="tbtn${app.repeat !== "off" ? " is-on" : ""}" data-playing-action="repeat" data-playing-app="${app.id}"
              aria-label="Repeat ${app.repeat}" aria-pressed="${app.repeat !== "off"}"
              title="Repeat ${app.repeat}"${app.repeatSupported ? "" : " hidden"}>${ICON.repeat}</button>
    </div>`;
}

function playingPageBodyHTML(app) {
  const track = trackOf(app);
  return `
    ${playingHeadHTML(app)}
    <div class="player-strip">
      <div class="artwork ${track.art}" aria-hidden="true">
        <span class="art-badge ${app.artClass}">${app.initial}</span>
      </div>
      <div class="track">
        <div class="track-title" title="${track.title}">${track.title}</div>
        <div class="track-artist">${track.artist}</div>
      </div>
      ${playingTransportHTML(app)}
    </div>
    ${app.canSeek ? `
      <div class="media-seek">
        <input class="range seek-slim" type="range" min="0" max="1000" step="1"
               value="${seekValue(app)}" data-playing-seek="${app.id}"
               style="--fill:${seekValue(app) / 10}%"
               aria-label="${track.title} playback position"
               aria-valuetext="${fmt(app.position)} of ${fmt(track.length)}">
        <div class="times">
          <span data-playing-elapsed="${app.id}">${fmt(app.position)}</span>
          <span data-playing-duration="${app.id}">${fmt(track.length)}</span>
        </div>
      </div>` : ""}
    <button class="playing-level" data-mix-app="${app.id}" title="Open in Mixer"
            aria-label="Open ${app.name} in Mixer">
      ${volumeIcon(app.muted, app.volume)}
      <span>${app.muted ? "Muted" : `${app.volume}%`}</span>
      ${app.mixed ? '<span class="lvl-mixed">Mixed</span>' : ""}
    </button>`;
}

function playingPageHTML(app) {
  return `<article class="playing-page" data-playing-page="${app.id}" aria-label="${app.name}">${playingPageBodyHTML(app)}</article>`;
}

function setPlayingHeight() {
  const viewport = $("playingViewport");
  const active = viewport.querySelector(".playing-page.is-active");
  if (!active) { viewport.style.height = ""; return; }
  viewport.style.height = `${active.offsetHeight}px`;
}

function updatePlayingAria() {
  const pages = [...$("playingTrack").querySelectorAll(".playing-page")];
  const active = playingIndex(state.playingId);
  pages.forEach((page, index) => {
    const isActive = index === active;
    page.classList.toggle("is-active", isActive);
    page.setAttribute("aria-hidden", String(!isActive));
    page.inert = !isActive;
  });
  setPlayingHeight();
}

function scrollToPlaying(smooth = true) {
  const viewport = $("playingViewport");
  const index = playingIndex(state.playingId);
  if (!viewport || index < 0) return;
  viewport.scrollTo({
    left: index * viewport.clientWidth,
    behavior: smooth && !reduceMotion() ? "smooth" : "auto",
  });
  updatePlayingAria();
  updateTray();
}

function renderPlaying() {
  const pages = playingApps();
  if (!pages.some((app) => app.id === state.playingId)) {
    state.playingId = pages[0]?.id ?? null;
  }

  const multi = pages.length > 1;
  $("prevPage").hidden = !multi;
  $("nextPage").hidden = !multi;

  const track = $("playingTrack");
  if (pages.length === 0) {
    $("playingViewport").style.height = "";
    track.innerHTML = `
      <div class="playing-empty">
        <div class="artwork art-empty empty-art" aria-hidden="true"></div>
        <div>
          <div class="t">No playing apps</div>
          <div class="s">Use Mixer for apps that are only sending audio.</div>
        </div>
      </div>`;
    return;
  }

  track.innerHTML = pages.map(playingPageHTML).join("");
  updatePlayingAria();
  requestAnimationFrame(() => scrollToPlaying(false));
}

function updatePlayingPage(app) {
  const page = $("playingTrack").querySelector(`[data-playing-page="${app.id}"]`);
  if (!page) return;
  page.innerHTML = playingPageBodyHTML(app);
  updatePlayingAria();
}

function updatePlayingSeek(app) {
  const page = $("playingTrack").querySelector(`[data-playing-page="${app.id}"]`);
  const seek = page?.querySelector(`[data-playing-seek="${app.id}"]`);
  if (!seek || !app.canSeek) return;
  const track = trackOf(app);
  if (!track?.length) return;
  const value = seekValue(app);
  seek.value = String(value);
  setFill(seek, value / 10);
  seek.setAttribute("aria-valuetext", `${fmt(app.position)} of ${fmt(track.length)}`);
  page.querySelector(`[data-playing-elapsed="${app.id}"]`).textContent = fmt(app.position);
  page.querySelector(`[data-playing-duration="${app.id}"]`).textContent = fmt(track.length);
}

/* Mixer mode: every app with audio, including audio-only apps. */

function mixerRowHTML(app) {
  const focused = state.mixFocusId === app.id;
  const playing = app.hasPlayer && app.playing;
  const sub = app.hasPlayer
    ? `${trackOf(app).title} · ${trackOf(app).artist}`
    : "Audio only";
  return `
    <div class="mixer-row${focused ? " is-focused" : ""}" data-mixer-app="${app.id}">
      <div class="mixer-head">
        <span class="app-art ${app.artClass}" aria-hidden="true">${app.initial}</span>
        <div class="mixer-meta">
          <div class="mixer-name-line">
            <span class="app-name">${app.name}</span>
            ${playing ? '<span class="playing-dot" title="Playing"></span>' : ""}
          </div>
          <div class="mixer-sub" title="${sub}">${sub}</div>
        </div>
        <button class="route" data-mixer-route="${app.id}" aria-haspopup="menu" aria-expanded="false"
                title="${routeFull(app)}" aria-label="${app.name} route: ${routeFull(app)}">
          <span class="rt">${routeShort(app)}</span>
        </button>
      </div>
      <div class="mixer-controls">
        <button class="mixer-mute${app.muted ? " is-on" : ""}" data-mixer-mute="${app.id}"
                aria-pressed="${app.muted}" aria-label="${app.muted ? "Unmute" : "Mute"} ${app.name}">
          ${volumeIcon(app.muted, app.volume)}
        </button>
        <input class="range secondary${app.muted ? " is-muted" : ""}" type="range" min="0" max="100" step="1"
               value="${app.volume}" data-mixer-range="${app.id}" style="--fill:${app.volume}%"
               aria-label="${app.name} volume">
        <span class="mixer-value">
          <span class="mixer-pct" data-mixer-pct="${app.id}">${app.volume}%</span>
          ${app.mixed ? '<span class="mixer-mixed" title="This app has streams at different levels">Mixed</span>' : ""}
        </span>
      </div>
    </div>`;
}

function renderMixer() {
  const list = $("mixerList");
  if (state.apps.length === 0) {
    list.innerHTML = `
      <div class="mixer-empty">
        <div class="artwork art-empty empty-art" aria-hidden="true"></div>
        <div>
          <div class="t">No apps playing</div>
          <div class="s">Apps with audio show up here with their own volume and route.</div>
        </div>
      </div>`;
    return;
  }
  list.innerHTML = state.apps.map(mixerRowHTML).join("");
}

function updateMixerRow(app) {
  const row = $("mixerList").querySelector(`[data-mixer-app="${app.id}"]`);
  if (!row) return;
  row.outerHTML = mixerRowHTML(app);
}

function updateMixerMute(app) {
  const row = $("mixerList").querySelector(`[data-mixer-app="${app.id}"]`);
  const button = row?.querySelector(`[data-mixer-mute="${app.id}"]`);
  const range = row?.querySelector(`[data-mixer-range="${app.id}"]`);
  if (!button) return;
  button.innerHTML = volumeIcon(app.muted, app.volume);
  button.classList.toggle("is-on", app.muted);
  button.setAttribute("aria-pressed", String(app.muted));
  button.setAttribute("aria-label", `${app.muted ? "Unmute" : "Mute"} ${app.name}`);
  range?.classList.toggle("is-muted", app.muted);
}

function updateMixerRoute(app) {
  const chip = $("mixerList").querySelector(`[data-mixer-route="${app.id}"]`);
  if (!chip) return;
  chip.querySelector(".rt").textContent = routeShort(app);
  chip.title = routeFull(app);
  chip.setAttribute("aria-label", `${app.name} route: ${routeFull(app)}`);
}

function updateAllRouteChips() {
  for (const app of state.apps) updateMixerRoute(app);
}

function updateModeDot() {
  $("playingDot").hidden = !(state.mode === "mixer" && anyPlaying());
}

function refreshApp(app) {
  updatePlayingPage(app);
  if (state.mode === "mixer") updateMixerRow(app);
  updateModeDot();
  updateTray();
}

function renderDeck() {
  const playing = state.mode === "playing";
  const playingTab = $("playingTab");
  const mixerTab = $("mixerTab");
  playingTab.classList.toggle("is-selected", playing);
  playingTab.setAttribute("aria-selected", String(playing));
  mixerTab.classList.toggle("is-selected", !playing);
  mixerTab.setAttribute("aria-selected", String(!playing));
  $("playingView").hidden = !playing;
  $("playingView").inert = !playing;
  $("mixerView").hidden = playing;
  $("mixerView").inert = playing;
  updateModeDot();

  if (playing) renderPlaying();
  else renderMixer();
  updateTray();
}

function scrollMixerFocus() {
  const row = $("mixerList").querySelector(`[data-mixer-app="${state.mixFocusId}"]`);
  if (!row) return;
  row.scrollIntoView({ block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" });
}

function setMode(mode) {
  if (state.mode === mode) return;
  state.mode = mode;
  renderDeck();
  if (mode === "playing") requestAnimationFrame(() => scrollToPlaying(false));
  if (mode === "mixer" && state.mixFocusId) requestAnimationFrame(scrollMixerFocus);
}

function openMixerFor(appId) {
  state.mixFocusId = appId;
  state.mode = "mixer";
  renderDeck();
  requestAnimationFrame(scrollMixerFocus);
}

/* ── render: input ───────────────────────────────────────────── */

function renderInput() {
  const input = state.input;
  const head = $("inputHead");
  const body = $("inputBody");
  const device = currentInput();
  const available = input.available;
  const name = device?.name ?? "No input available";

  head.setAttribute("aria-expanded", String(state.inputOpen));
  $("inputSummary").textContent = available
    ? (input.muted ? `${name} · Muted` : name)
    : "No input available";
  $("inputDot").hidden = !(available && input.consumers.length > 0);

  body.hidden = !state.inputOpen;
  if (!state.inputOpen) return;

  $("inputDeviceName").textContent = name;
  $("inputDevice").disabled = !available;
  $("inputMute").innerHTML = input.muted ? ICON.micMute : ICON.mic;
  $("inputMute").classList.toggle("is-on", input.muted);
  $("inputMute").disabled = !available;
  $("inputMute").setAttribute("aria-pressed", String(input.muted));
  $("inputMute").setAttribute("aria-label", `${input.muted ? "Unmute" : "Mute"} ${name}`);

  $("inputRange").value = String(input.level);
  $("inputRange").disabled = !available;
  $("inputRange").classList.toggle("is-muted", input.muted);
  setFill($("inputRange"), input.level);
  $("inputValue").textContent = available ? `${input.level}%` : "—";

  const consumer = input.consumers[0];
  $("micConsumer").hidden = !(available && consumer);
  if (consumer) {
    $("micConsumer").querySelector(".who").textContent = consumer.name;
    $("micConsumer").querySelector(".mini-art").className = `mini-art ${consumer.artClass}`;
  }
  $("inputEmpty").hidden = Boolean(consumer) && available;
  $("inputEmpty").textContent = available ? "No microphone use right now." : "No microphone detected.";
}

/* ── render: tray icon + dropdown ────────────────────────────── */

function updateTray() {
  const cluster = $("trayCluster");
  const app = trayPlayer();
  const enabled = state.mediaWidgetEnabled;
  cluster.hidden = !app || !enabled;
  if (!app || !enabled) {
    $("trayCue").hidden = true;
    closeTray(false);
    return;
  }

  const track = trackOf(app);
  const title = track?.title || app.name;
  const artist = track?.artist || "";
  const main = $("trayMain");
  $("trayArt").className = `tray-art ${track?.art || "art-empty"}`;
  $("trayTitle").textContent = title;
  $("trayArtist").textContent = artist;
  $("trayArtist").hidden = !artist;
  main.title = artist ? `${title} — ${artist}` : title;
  main.setAttribute("aria-label", artist ? `Open now playing: ${title} — ${artist}` : `Open now playing: ${title}`);
  main.setAttribute("aria-expanded", String(state.trayOpen));

  const play = $("trayPlayPause");
  play.innerHTML = app.playing ? ICON.pause : ICON.play;
  play.setAttribute("aria-label", `${app.playing ? "Pause" : "Play"} ${title}`);
  play.title = `${app.playing ? "Pause" : "Play"} ${title}`;

  $("trayPrev").hidden = !app.canPrev;
  $("trayNext").hidden = !app.canNext;

  const shuffle = $("trayShuffle");
  shuffle.hidden = !app.shuffleSupported;
  shuffle.classList.toggle("is-on", Boolean(app.shuffle));
  shuffle.setAttribute("aria-pressed", String(Boolean(app.shuffle)));
  shuffle.setAttribute("aria-label", app.shuffle ? "Shuffle on" : "Shuffle off");

  const repeat = $("trayRepeat");
  repeat.hidden = !app.repeatSupported;
  repeat.classList.toggle("is-on", app.repeat !== "off");
  repeat.setAttribute("aria-pressed", String(app.repeat !== "off"));
  repeat.setAttribute("aria-label", `Repeat ${app.repeat}`);

  if (state.trayOpen) renderTrayPop();
}

function showTrayCue() {
  const app = trayPlayer();
  if (!app) return;
  const pages = playingApps();
  const cue = $("trayCue");
  cue.textContent = `${playingIndex(app.id) + 1}/${pages.length} · ${app.name}`;
  cue.hidden = false;
  requestAnimationFrame(() => cue.classList.add("show"));
  clearTimeout(trayCueTimer);
  trayCueTimer = setTimeout(() => {
    cue.classList.remove("show");
    setTimeout(() => { cue.hidden = true; }, 180);
  }, 1000);
}

function trayPlayerRowHTML(player, activeId) {
  const track = trackOf(player);
  const active = player.id === activeId;
  return `
    <button class="tray-player${active ? " is-active" : ""}" data-tray-player="${player.id}"
            aria-current="${active ? "true" : "false"}">
      <span class="app-art ${player.artClass}" aria-hidden="true">${player.initial}</span>
      <span class="tray-player-meta">
        <span class="tray-player-name-line">
          <span class="tray-player-name">${player.name}</span>
          ${player.playing ? '<span class="playing-dot" title="Playing"></span>' : ""}
        </span>
        <span class="tray-player-track">${track?.title || "Audio only"}</span>
      </span>
      <span class="tray-check">${active ? ICON.check : ""}</span>
    </button>`;
}

function trayPopHTML(app) {
  const track = trackOf(app);
  const players = playingApps();
  const multi = players.length > 1;
  const playLabel = `${app.playing ? "Pause" : "Play"} ${track.title}`;
  return `
    <div class="tray-head">
      <span class="tray-caption">Now playing</span>
      <span class="tray-source">
        <span class="tray-source-art ${app.artClass}" aria-hidden="true">${app.initial}</span>
        <span class="tray-source-name">${app.name}</span>
      </span>
    </div>

    <div class="tray-track-row">
      <div class="tray-artwork ${track.art}" aria-hidden="true"></div>
      <div class="tray-meta">
        <div class="tray-title" title="${track.title}">${track.title}</div>
        <div class="tray-artist">${track.artist}</div>
      </div>
    </div>

    <div class="tray-transport">
      <button class="tray-btn" data-tray-action="prev" aria-label="Previous track" title="Previous track"${app.canPrev ? "" : " hidden"}>${ICON.prev}</button>
      <button class="tray-btn play" data-tray-action="play-pause" aria-label="${playLabel}" title="${app.playing ? "Pause" : "Play"}">${app.playing ? ICON.pause : ICON.play}</button>
      <button class="tray-btn" data-tray-action="next" aria-label="Next track" title="Next track"${app.canNext ? "" : " hidden"}>${ICON.next}</button>
      <button class="tray-btn${app.shuffle ? " is-on" : ""}" data-tray-action="shuffle" aria-label="${app.shuffle ? "Shuffle on" : "Shuffle off"}" aria-pressed="${Boolean(app.shuffle)}" title="${app.shuffle ? "Shuffle on" : "Shuffle off"}"${app.shuffleSupported ? "" : " hidden"}>${ICON.shuffle}</button>
      <button class="tray-btn${app.repeat !== "off" ? " is-on" : ""}" data-tray-action="repeat" aria-label="Repeat ${app.repeat}" aria-pressed="${app.repeat !== "off"}" title="Repeat ${app.repeat}"${app.repeatSupported ? "" : " hidden"}>${ICON.repeat}</button>
    </div>

    ${app.canSeek ? `
      <div class="tray-seek">
        <input class="range seek-slim" type="range" min="0" max="1000" step="1"
               value="${seekValue(app)}" data-tray-seek="${app.id}"
               style="--fill:${seekValue(app) / 10}%"
               aria-label="${track.title} playback position"
               aria-valuetext="${fmt(app.position)} of ${fmt(track.length)}">
        <div class="tray-times">
          <span data-tray-elapsed="${app.id}">${fmt(app.position)}</span>
          <span data-tray-duration="${app.id}">${fmt(track.length)}</span>
        </div>
      </div>` : ""}

    ${multi ? `
      <div class="tray-divider"></div>
      <div class="tray-players-head">Players</div>
      ${players.map((player) => trayPlayerRowHTML(player, app.id)).join("")}` : ""}

    <div class="tray-foot">
      <button class="tray-open" data-tray-open>${ICON.volume}<span>Open sound panel</span></button>
    </div>`;
}

function renderTrayPop() {
  const pop = $("trayPop");
  const app = trayPlayer();
  if (!app) { pop.hidden = true; return; }
  pop.innerHTML = trayPopHTML(app);
  pop.hidden = false;
  positionTrayPop();
}

function updateTraySeek(app) {
  if (!state.trayOpen || trayPlayer()?.id !== app.id) return;
  const pop = $("trayPop");
  const seek = pop.querySelector(`[data-tray-seek="${app.id}"]`);
  if (!seek || !app.canSeek) return;
  const track = trackOf(app);
  if (!track?.length) return;
  const value = seekValue(app);
  seek.value = String(value);
  setFill(seek, value / 10);
  seek.setAttribute("aria-valuetext", `${fmt(app.position)} of ${fmt(track.length)}`);
  pop.querySelector(`[data-tray-elapsed="${app.id}"]`).textContent = fmt(app.position);
  pop.querySelector(`[data-tray-duration="${app.id}"]`).textContent = fmt(track.length);
}

function positionTrayPop() {
  const pop = $("trayPop");
  const strip = $("trayStrip");
  if (pop.hidden || !strip) return;
  const rect = strip.getBoundingClientRect();
  const width = pop.offsetWidth;
  const height = pop.offsetHeight;
  let left = Math.min(window.innerWidth - width - 8, Math.max(8, rect.right - width));
  let top = rect.bottom + 6;
  if (top + height > window.innerHeight - 8) top = Math.max(8, rect.top - height - 6);
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
}

function openTray() {
  if (!state.mediaWidgetEnabled) return;
  const app = trayPlayer();
  if (!app) return;
  state.trayOpen = true;
  $("trayMain").setAttribute("aria-expanded", "true");
  renderTrayPop();
  if (keyboardMode) $("trayPop").querySelector('[data-tray-action="play-pause"]')?.focus({ preventScroll: true });
}

function closeTray(restoreFocus = false) {
  if (!state.trayOpen) return;
  state.trayOpen = false;
  $("trayPop").hidden = true;
  $("trayMain").setAttribute("aria-expanded", "false");
  if (restoreFocus) $("trayMain").focus();
}

function toggleTray() {
  if (state.trayOpen) closeTray(false);
  else openTray();
}

function renderWidgetToggle() {
  $("widgetToggle").setAttribute("aria-checked", String(state.mediaWidgetEnabled));
}

function positionSettingsPop() {
  const pop = $("settingsPop");
  const gear = $("settingsGear");
  if (pop.hidden || !gear) return;
  const rect = gear.getBoundingClientRect();
  const width = pop.offsetWidth;
  const height = pop.offsetHeight;
  let left = Math.min(window.innerWidth - width - 8, Math.max(8, rect.right - width));
  let top = rect.bottom + 6;
  if (top + height > window.innerHeight - 8) top = Math.max(8, rect.top - height - 6);
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
}

function openSettings() {
  setPanelOpen(true);
  closeTray(false);
  state.settingsOpen = true;
  $("settingsPop").hidden = false;
  $("settingsGear").classList.add("is-active");
  $("settingsGear").setAttribute("aria-expanded", "true");
  renderWidgetToggle();
  positionSettingsPop();
}

function closeSettings() {
  if (!state.settingsOpen) return;
  state.settingsOpen = false;
  $("settingsPop").hidden = true;
  $("settingsGear").classList.remove("is-active");
  $("settingsGear").setAttribute("aria-expanded", "false");
}

function toggleSettings() {
  if (state.settingsOpen) closeSettings();
  else openSettings();
}

function setWidgetEnabled(enabled) {
  state.mediaWidgetEnabled = enabled;
  saveWidgetEnabled(enabled);
  if (!enabled) closeTray(false);
  renderWidgetToggle();
  updateTray();
}

function selectTrayPlayer(appId) {
  const app = appById(appId);
  if (!app?.hasPlayer) return;
  state.playingId = app.id;
  renderPlaying();
  if (state.mode === "playing") scrollToPlaying(false);
  updateTray();
}

function trayAction(action) {
  const app = trayPlayer();
  if (!app) return;
  if (action === "play-pause") {
    app.playing = !app.playing;
    refreshApp(app);
    return;
  }
  if (action === "prev") { changeTrack(app, -1); return; }
  if (action === "next") { changeTrack(app, 1); return; }
  if (action === "shuffle") {
    if (!app.shuffleSupported) return;
    app.shuffle = !app.shuffle;
    refreshApp(app);
    return;
  }
  if (action === "repeat") {
    if (!app.repeatSupported) return;
    const order = ["off", "all", "one"];
    app.repeat = order[(order.indexOf(app.repeat) + 1) % order.length];
    refreshApp(app);
  }
}

function openPanelFromTray() {
  closeTray(false);
  state.mode = "playing";
  renderDeck();
  setPanelOpen(true);
}

/* ── render: bar ─────────────────────────────────────────────── */
/* ── render: bar ─────────────────────────────────────────────── */

function renderBar() {
  const device = currentDevice();
  const volumeBtn = $("barVolume");
  volumeBtn.innerHTML = volumeIcon(device.muted, device.level);
  volumeBtn.classList.toggle("is-active", state.panelOpen);
  volumeBtn.setAttribute("aria-expanded", String(state.panelOpen));
  volumeBtn.setAttribute("aria-label",
    `Sound, ${device.name}, ${device.muted ? "muted" : `${device.level} percent`}`);

  const mic = $("barMic");
  const live = state.input.available && state.input.consumers.length > 0;
  mic.hidden = !live;
  mic.setAttribute("aria-label", state.input.muted
    ? "Microphone in use, muted"
    : "Microphone in use");

  updateTray();
}

/* ── render all ──────────────────────────────────────────────── */

function renderAll() {
  renderHero();
  renderDeck();
  renderInput();
  renderBar();
}

/* ── panel open / close ──────────────────────────────────────── */

function setPanelOpen(open, { toastOnClose = false } = {}) {
  state.panelOpen = open;
  document.body.classList.toggle("is-closed", !open);
  if (!open) {
    closeMenu(false);
    closeSettings();
  }
  renderBar();
  if (!open && toastOnClose) toast("Sound closed — click the speaker to reopen");
}

/* ── device & route menus ────────────────────────────────────── */

function openOutputMenu() {
  const anchor = $("outputDevice");
  if (openMenuState?.anchor === anchor) { closeMenu(true); return; }
  const current = currentDevice();
  openMenu(anchor, {
    title: "Output device",
    width: 252,
    items: state.devices.map((device) => ({
      label: device.name,
      note: device.available ? (device.id === current.id ? "Selected" : "") : "Unavailable",
      selected: device.id === current.id,
      disabled: !device.available,
      onSelect: () => {
        state.outputId = device.id;
        renderHero();
        updateAllRouteChips();
        renderBar();
        toast(`Output · ${device.name}`);
      }
    }))
  });
}

function openInputMenu() {
  const anchor = $("inputDevice");
  if (openMenuState?.anchor === anchor) { closeMenu(true); return; }
  const current = currentInput();
  openMenu(anchor, {
    title: "Input device",
    width: 252,
    items: state.inputs.map((device) => ({
      label: device.name,
      note: device.available ? (device.id === current?.id ? "Selected" : "") : "Unavailable",
      selected: device.id === current?.id,
      disabled: !device.available,
      onSelect: () => {
        state.input.deviceId = device.id;
        renderInput();
        toast(`Input · ${device.name}`);
      }
    }))
  });
}

function openRouteMenu(app, anchor) {
  if (openMenuState?.anchor === anchor) { closeMenu(true); return; }
  openMenu(anchor, {
    title: `${app.name} output route`,
    width: 248,
    items: [
      {
        label: `Follow preferred · ${currentDevice().name}`,
        selected: app.route === "follow-preferred",
        onSelect: () => {
          app.route = "follow-preferred";
          app.override = null;
          updateMixerRoute(app);
          toast(`${app.name} follows ${currentDevice().name}`);
        }
      },
      ...state.devices.map((device) => ({
        label: device.available ? `${device.name} · Override` : device.name,
        note: device.available ? "" : "Unavailable",
        selected: app.route === "explicit" && app.override === device.id,
        disabled: !device.available,
        onSelect: () => {
          app.route = "explicit";
          app.override = device.id;
          updateMixerRoute(app);
          toast(`${app.name} routed to ${device.name}`);
        }
      }))
    ]
  });
}

/* ── playing actions ─────────────────────────────────────────── */

function changeTrack(app, delta) {
  if (!app?.hasPlayer) return;
  if (delta < 0 && app.position > 5) {
    app.position = 0;
  } else {
    app.trackIndex = (app.trackIndex + delta + app.tracks.length) % app.tracks.length;
    app.position = 0;
  }
  refreshApp(app);
}

function playingAction(app, action) {
  if (!app) return;
  if (action === "play-pause") {
    if (!app.hasPlayer) return;
    app.playing = !app.playing;
    refreshApp(app);
    return;
  }
  if (action === "prev") { changeTrack(app, -1); return; }
  if (action === "next") { changeTrack(app, 1); return; }
  if (action === "shuffle") {
    if (!app.shuffleSupported) return;
    app.shuffle = !app.shuffle;
    refreshApp(app);
    return;
  }
  if (action === "repeat") {
    if (!app.repeatSupported) return;
    const order = ["off", "all", "one"];
    app.repeat = order[(order.indexOf(app.repeat) + 1) % order.length];
    refreshApp(app);
  }
}

function goToPlayer(delta) {
  const pages = playingApps();
  if (pages.length <= 1) return;
  const current = Math.max(0, playingIndex(state.playingId));
  const next = (current + delta + pages.length) % pages.length;
  state.playingId = pages[next].id;
  scrollToPlaying(false);
}

/* ── wiring ──────────────────────────────────────────────────── */

$("barVolume").addEventListener("click", () => {
  const hadTray = state.trayOpen;
  closeTray(false);
  if (hadTray) {
    setPanelOpen(true);
    return;
  }
  setPanelOpen(!state.panelOpen);
});

$("settingsGear").addEventListener("click", () => {
  toggleSettings();
});

$("widgetToggle").addEventListener("click", () => {
  setWidgetEnabled(!state.mediaWidgetEnabled);
});

$("trayStrip").addEventListener("click", (event) => {
  if (event.target.closest(".tray-strip-controls")) return;
  setPanelOpen(false);
  toggleTray();
});

$("trayStripControls").addEventListener("click", (event) => {
  const button = event.target.closest("[data-tray-action]");
  if (!button) return;
  event.stopPropagation();
  trayAction(button.dataset.trayAction);
});

let lastTrayWheel = 0;
$("trayStrip").addEventListener("wheel", (event) => {
  event.preventDefault();
  const now = Date.now();
  if (now - lastTrayWheel < 250) return;
  lastTrayWheel = now;
  const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
  if (!delta) return;
  goToPlayer(delta > 0 ? 1 : -1);
  showTrayCue();
}, { passive: false });

$("trayPop").addEventListener("click", (event) => {
  event.stopPropagation();
  const open = event.target.closest("[data-tray-open]");
  if (open) {
    openPanelFromTray();
    return;
  }

  const player = event.target.closest("[data-tray-player]");
  if (player) {
    selectTrayPlayer(player.dataset.trayPlayer);
    return;
  }

  const action = event.target.closest("[data-tray-action]");
  if (action) trayAction(action.dataset.trayAction);
});

$("trayPop").addEventListener("input", (event) => {
  const seek = event.target.closest("[data-tray-seek]");
  if (!seek) return;
  const app = trayPlayer();
  if (!app?.canSeek) return;
  const track = trackOf(app);
  if (!track?.length) return;
  seekingAppId = app.id;
  app.position = (Number(seek.value) / 1000) * track.length;
  updatePlayingSeek(app);
  updateTraySeek(app);
});

$("trayPop").addEventListener("change", (event) => {
  if (event.target.closest("[data-tray-seek]")) seekingAppId = null;
});
$("trayPop").addEventListener("pointerup", (event) => {
  if (event.target.closest("[data-tray-seek]")) seekingAppId = null;
});

$("barMic").addEventListener("click", () => {
  state.inputOpen = true;
  setPanelOpen(true);
  renderInput();
});

$("outputMute").addEventListener("click", () => {
  const device = currentDevice();
  if (!device.available) return;
  device.muted = !device.muted;
  renderHero();
  renderBar();
});

$("outputDevice").addEventListener("click", openOutputMenu);

$("outputRange").addEventListener("input", (event) => {
  const device = currentDevice();
  if (!device.available) return;
  device.level = Number(event.target.value);
  $("outputValue").innerHTML = `${device.level}<span class="unit">%</span>`;
  setFill(event.target, device.level);
  event.target.setAttribute("aria-valuetext", `${device.level} percent`);
  renderBar();
});

$("inputHead").addEventListener("click", () => {
  state.inputOpen = !state.inputOpen;
  renderInput();
});

$("inputDevice").addEventListener("click", openInputMenu);

$("inputMute").addEventListener("click", () => {
  if (!state.input.available) return;
  state.input.muted = !state.input.muted;
  renderInput();
  renderBar();
});

$("inputRange").addEventListener("input", (event) => {
  if (!state.input.available) return;
  state.input.level = Number(event.target.value);
  $("inputValue").textContent = `${state.input.level}%`;
  setFill(event.target, state.input.level);
  event.target.setAttribute("aria-valuetext", `${state.input.level} percent`);
});

let seekingAppId = null;
let scrollTimer = null;

$("prevPage").addEventListener("click", () => goToPlayer(-1));
$("nextPage").addEventListener("click", () => goToPlayer(1));
$("playingTab").addEventListener("click", () => setMode("playing"));
$("mixerTab").addEventListener("click", () => setMode("mixer"));

/* Playing controls are delegated because pages are rebuilt on state changes. */
$("playingTrack").addEventListener("click", (event) => {
  const action = event.target.closest("[data-playing-action]");
  if (action) {
    const app = appById(action.dataset.playingApp);
    playingAction(app, action.dataset.playingAction);
    return;
  }

  const level = event.target.closest("[data-mix-app]");
  if (level) openMixerFor(level.dataset.mixApp);
});

$("playingTrack").addEventListener("input", (event) => {
  const seek = event.target.closest("[data-playing-seek]");
  if (!seek) return;
  const app = appById(seek.dataset.playingSeek);
  if (!app?.canSeek) return;
  const track = trackOf(app);
  if (!track?.length) return;
  seekingAppId = app.id;
  app.position = (Number(seek.value) / 1000) * track.length;
  const page = $("playingTrack").querySelector(`[data-playing-page="${app.id}"]`);
  page.querySelector(`[data-playing-elapsed="${app.id}"]`).textContent = fmt(app.position);
  setFill(seek, Number(seek.value) / 10);
});

$("playingTrack").addEventListener("change", (event) => {
  if (event.target.closest("[data-playing-seek]")) seekingAppId = null;
});
$("playingTrack").addEventListener("pointerup", (event) => {
  if (event.target.closest("[data-playing-seek]")) seekingAppId = null;
});

/* Mixer controls never change mode; the row itself has no click action. */
$("mixerList").addEventListener("click", (event) => {
  const mute = event.target.closest("[data-mixer-mute]");
  if (mute) {
    const app = appById(mute.dataset.mixerMute);
    if (!app) return;
    app.muted = !app.muted;
    updateMixerMute(app);
    return;
  }

  const route = event.target.closest("[data-mixer-route]");
  if (route) {
    const app = appById(route.dataset.mixerRoute);
    if (app) openRouteMenu(app, route);
  }
});

$("mixerList").addEventListener("input", (event) => {
  const range = event.target.closest("[data-mixer-range]");
  if (!range) return;
  const app = appById(range.dataset.mixerRange);
  if (!app) return;
  app.volume = Number(range.value);
  setFill(range, app.volume);
  range.setAttribute("aria-valuetext", `${app.volume} percent`);
  const pct = $("mixerList").querySelector(`[data-mixer-pct="${app.id}"]`);
  if (pct) pct.textContent = `${app.volume}%`;
});

/* Horizontal swipe/scroll updates the focused playing page. */
const playingViewport = $("playingViewport");
playingViewport.addEventListener("scroll", () => {
  closeMenu(false);
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const pages = playingApps();
    if (!pages.length) return;
    const width = playingViewport.clientWidth;
    if (!width) return;
    const index = clamp(Math.round(playingViewport.scrollLeft / width), 0, pages.length - 1);
    const app = pages[index];
    if (app && app.id !== state.playingId) {
      state.playingId = app.id;
      updatePlayingAria();
      updateTray();
    }
  }, 80);
}, { passive: true });

/* ── outside click / Esc / scrolling ─────────────────────────── */

document.addEventListener("click", (event) => {
  if (state.settingsOpen && !event.target.closest("#settingsPop") && !event.target.closest("#settingsGear")) {
    closeSettings();
  }

  if (state.trayOpen && !event.target.closest("#trayPop") && !event.target.closest("#trayStrip")) {
    closeTray(false);
  }

  if (openMenuState && !event.target.closest(".menu") && !openMenuState.anchor.contains(event.target)) {
    closeMenu(false);
  }

  if (!state.panelOpen) return;
  if (event.target.closest("#panel") || event.target.closest(".menu") ||
      event.target.closest("#barVolume") || event.target.closest("#barMic") ||
      event.target.closest("#trayPop") || event.target.closest("#trayStrip") ||
      event.target.closest("#settingsPop")) return;
  setPanelOpen(false, { toastOnClose: true });
});

$("popScroll").addEventListener("scroll", () => closeMenu(false), { passive: true });
window.addEventListener("resize", () => {
  closeMenu(false);
  closeTray(false);
  closeSettings();
  requestAnimationFrame(() => {
    if (state.mode === "playing") scrollToPlaying(false);
    else if (state.mixFocusId) scrollMixerFocus();
  });
});

window.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;

  if (state.settingsOpen) {
    event.preventDefault();
    closeSettings();
    return;
  }

  if (state.trayOpen) {
    event.preventDefault();
    closeTray(true);
    return;
  }

  if (openMenuState) {
    event.preventDefault();
    closeMenu(true);
    return;
  }

  if (state.panelOpen) {
    event.preventDefault();
    setPanelOpen(false, { toastOnClose: true });
  }
});

/* ── live simulation ─────────────────────────────────────────── */

setInterval(() => {
  for (const app of state.apps) {
    if (!app.hasPlayer || !app.playing || !app.canSeek || app.id === seekingAppId) continue;
    const track = trackOf(app);
    if (!track?.length) continue;
    app.position = Math.min(track.length, app.position + 1);
    if (app.position >= track.length) {
      app.position = 0;
      app.trackIndex = (app.trackIndex + 1) % app.tracks.length;
      refreshApp(app);
      continue;
    }
    updatePlayingSeek(app);
  }
}, 1000);

/* ── boot ────────────────────────────────────────────────────── */

setPanelOpen(true);
renderAll();
if (params.get("panel") === "closed") setPanelOpen(false);
const wantsSettings = params.get("settings") === "1";
if (params.get("tray") === "1" && !wantsSettings) {
  setPanelOpen(false);
  setTimeout(openTray, 300);
}
if (wantsSettings) {
  setTimeout(openSettings, 50);
}
if (state.mode === "mixer" && state.mixFocusId) {
  requestAnimationFrame(scrollMixerFocus);
}
</script>
